<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Araña">
<meta name="theme-color" content="#090a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Araña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Unbounded:wght@700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: una sola pantalla fija. Arriba la marca, en medio las "estaciones" (apps, ajustes, bolsillo) por las que camina la araña, abajo la barra de órdenes. */
:root{
  --bg:#eef0f3; --fg:#14171b; --muted:#5d6572; --line:#d4d9e0; --panel:#ffffff; --accent:#2e5a78; --accent-fg:#fff;
  --say-bg:rgba(16,18,22,.86); --say-ink:#f3f1ec; --ring:#e3b866;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Geist", -apple-system, system-ui, "Segoe UI", sans-serif;
  --app-1:#35698c; --app-2:#c4893a; --app-3:#557a52; --app-4:#8c4c5b; --app-5:#4a4f7d; --app-6:#776654; --set:#3a414b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1216; --fg:#e8eaed; --muted:#98a0ab; --line:#262b33; --panel:#171b20; --accent:#8fb7d4; --accent-fg:#0c1014; --set:#2a3039; color-scheme:dark }
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none}
#app{position:fixed; inset:0; display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px, env(safe-area-inset-left,0px))}
.top{display:flex; align-items:baseline; justify-content:space-between; padding:4px 2px 10px}
.brand{font-family:var(--f-display); font-size:34px; line-height:1}
.brand small{font-style:italic; font-size:15px; color:var(--muted); margin-left:6px}
.iconbtn{border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; font-size:13px; padding:7px 12px; border-radius:999px}
.field{flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; overflow:hidden}
/* Pantalla de inicio al estilo de su iPhone: páginas de 4×6, puntos, barra y dock */
/* 0.18.0: la pantalla del prototipo que eligió Juan: rejilla fina, brillos violeta y verde azulado, cristal oscuro */
:root{--home:#090a14; --home-ink:#fff; --ic:58px; --pink:#ff4fa3; --green:#3dff9a; --cyan:#5ee7ff; --orange:#ff9a3d; --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace}
body{background:var(--home); -webkit-touch-callout:none}
#app{color:var(--home-ink); background:
  repeating-linear-gradient(0deg,rgba(94,231,255,.035) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgba(94,231,255,.035) 0 1px,transparent 1px 28px),
  radial-gradient(110% 70% at 15% 5%,#33205e 0%,transparent 60%),
  radial-gradient(100% 70% at 95% 95%,#0e4152 0%,transparent 60%),var(--home)}
#app .brand{font-family:"Unbounded", var(--f-display); font-weight:700; font-size:26px; letter-spacing:-.02em}
#app .brand small{font-family:var(--f-mono); font-style:normal; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--pink)!important; margin-left:8px; font-weight:600}
#app .top .iconbtn{border-color:rgba(255,255,255,.35); color:#fff}
#app .top .iconbtn.on{background:#fff; color:#2a241d; border-color:#fff}
.top [hidden]{display:none}
.pager{position:relative; flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; margin:0 -16px; touch-action:pan-x}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%; scroll-snap-align:start; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(6,minmax(0,1fr)); align-items:center; justify-items:center; padding:0 12px}
.dots{display:flex; justify-content:center; gap:7px; padding:6px 0 2px}
.dots i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
#app .tile{color:#fff; width:100%; position:relative}
#app .tile .sq{width:var(--ic); height:var(--ic); border-radius:calc(var(--ic)*.23); color:var(--fg2,#fff); box-shadow:0 2px 8px rgba(0,0,0,.35)}
#app .tile .sq.img{background:transparent; overflow:hidden}
#app .tile .sq.img img{width:100%; height:100%; display:block; object-fit:cover; border-radius:inherit; pointer-events:none}
.ipick{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.ipick button{border:1px solid var(--line); background:transparent; border-radius:14px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; font:inherit; font-size:11px; color:var(--fg)}
.ipick img{width:48px; height:48px; border-radius:11px}
.ipick span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#app .tile .sq b{font-family:var(--f-body); font-weight:600; font-size:calc(var(--ic)*.36); letter-spacing:-.02em}
#app .tile .nm{font-family:-apple-system,"SF Pro Text",var(--f-body); font-size:12px; font-weight:400; text-shadow:0 1px 2px rgba(0,0,0,.5); max-width:calc(var(--ic) + 22px)}
.tile .x{display:none; position:absolute; top:-6px; left:calc(50% - var(--ic)/2 - 6px); width:22px; height:22px; border-radius:50%; background:#d9d6d0; color:#222; font-size:15px; line-height:22px; text-align:center; z-index:2}
body.editing .tile .x{display:block}
body.editing .page .tile .sq, body.editing .dock .tile .sq{animation:jig .26s ease-in-out infinite alternate}
body.editing .page .tile:nth-child(2n) .sq{animation-delay:-.13s}
@keyframes jig{from{transform:rotate(-2deg)} to{transform:rotate(2deg)}}
.folder .sq{background:rgba(255,255,255,.22)!important; display:grid!important; grid-template-columns:repeat(3,1fr); gap:3px; padding:calc(var(--ic)*.14)}
.folder .sq{place-items:stretch!important; align-content:start}
.folder .sq i{display:block; width:100%; border-radius:3px; aspect-ratio:1}
.widget{grid-column:span 2; grid-row:span 2; align-self:stretch; justify-self:stretch; margin:6px 6px 14px; border-radius:22px; padding:12px; background:rgba(20,22,40,.6); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); color:#fff; display:flex; flex-direction:column; gap:8px; min-height:0; border:0; font:inherit; text-align:left}
.widget .wl{font-size:12px; font-weight:600; letter-spacing:.02em; opacity:.85}
.wgrid{flex:1; display:grid; grid-template-columns:repeat(4,1fr); align-items:center; justify-items:center; gap:4px}
#app .wgrid .tile .sq{width:calc(var(--ic)*.6); height:calc(var(--ic)*.6); border-radius:50%; box-shadow:none; background:rgba(255,255,255,.16)}
#app .wgrid .tile .sq svg{width:18px; height:18px}
#app .wgrid .tile .nm{display:none}
.wpocket{background:#fffdf3; color:#222; box-shadow:0 2px 10px rgba(0,0,0,.3)}
.wpocket .wl{color:#d29a00; font-weight:700; opacity:1; font-size:13px}
.wclock{font-size:12px; font-weight:500; color:#8fe8ff; font-variant-numeric:tabular-nums; float:right}
.wpocket #pocketTxt{flex:1; min-height:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; font-size:13.5px; line-height:1.3; opacity:.75}
.wpocket.full #pocketTxt{opacity:1}
.wpocket .dot{color:#d29a00; width:26px; height:26px; flex:none; border-radius:50%; border:1.5px solid currentColor; display:grid; place-items:center; align-self:flex-end}
.wpocket .dot i{width:7px; height:7px; background:currentColor; transform:rotate(45deg)}
#app #bar{padding:6px 18px 8px}
#app #cmd{background:rgba(10,12,28,.6); border-color:rgba(255,255,255,.1); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:#fff; border-radius:999px; text-align:center}
#app #cmd::placeholder{color:rgba(255,255,255,.75)}
#app #bar .btn.ghost{background:rgba(10,12,28,.6); border-color:rgba(255,255,255,.1); color:#fff; border-radius:999px}
#app #bar .btn{border-radius:999px; background:var(--pink); color:#0a0c15; font-weight:600}
.dock{display:grid; grid-template-columns:repeat(4,1fr); justify-items:center; align-items:center; padding:12px 10px; margin:0 -4px; border-radius:34px; background:rgba(255,255,255,.12); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); min-height:calc(var(--ic) + 24px)}
.dock .tile .nm{display:none}
.inp{width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg)}
.sw{width:30px; height:30px; flex:none; border-radius:8px; display:grid; place-items:center; font-weight:600; font-size:12px}
.lbl{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; margin:0 2px 8px}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px 6px}
.tile{display:flex; flex-direction:column; align-items:center; gap:5px; border:0; background:none; padding:0; color:var(--fg); font:inherit; min-width:0}
.tile .sq{width:54px; height:54px; border-radius:15px; display:grid; place-items:center; background:var(--c); color:#fff; transition:box-shadow .2s}
.tile .sq b{font-family:var(--f-display); font-weight:400; font-size:28px}
.tile .sq svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tile .nm{font-size:11px; font-weight:500; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.webbed{box-shadow:0 0 0 2px var(--orange), 0 0 14px 2px rgba(255,154,61,.45)}
.pocket{width:100%; display:flex; align-items:center; gap:12px; border:1px dashed var(--line); background:var(--panel); color:var(--fg); border-radius:16px; padding:12px 14px; font:inherit; text-align:left}
.pocket .dot{width:30px; height:30px; flex:none; border-radius:50%; border:1.5px solid currentColor; display:grid; place-items:center}
.pocket .dot i{width:8px; height:8px; background:currentColor; transform:rotate(45deg)}
.pocket span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted)}
.pocket.full span{color:var(--fg)}
#bar{display:flex; gap:8px; padding-top:10px}
#cmd{flex:1; min-width:0; font:inherit; font-size:16px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--fg); -webkit-user-select:text; user-select:text}
#cmd:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{font:inherit; font-weight:500; border:0; border-radius:14px; padding:12px 16px; background:var(--accent); color:var(--accent-fg)}
.btn.ghost{background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:12px}
button:focus-visible{outline:2px solid var(--ring); outline-offset:2px}

#spider{position:fixed; inset:0; pointer-events:none; z-index:20}
/* Etiquetas que deja la araña sobre lo que lee o pulsa (0.18.0) */
.tagbox{position:absolute; border:1.5px solid var(--cyan); border-radius:6px; box-shadow:0 0 12px -2px var(--cyan); animation:tagIn .2s ease-out, tagOut .4s ease-in 1.5s forwards}
.tagbox b{position:absolute; bottom:100%; left:-1.5px; margin-bottom:3px; font:600 9.5px/1 var(--f-mono); letter-spacing:.06em; color:#0a0c15; background:var(--cyan); padding:3px 6px; border-radius:3px; white-space:nowrap}
.tagbox.pink{border-color:var(--pink); box-shadow:0 0 12px -2px var(--pink)} .tagbox.pink b{background:var(--pink)}
.tagbox.orange{border-color:var(--orange); box-shadow:0 0 12px -2px var(--orange)} .tagbox.orange b{background:var(--orange)}
.tagbox.green{border-color:var(--green); box-shadow:0 0 12px -2px var(--green)} .tagbox.green b{background:var(--green)}
@keyframes tagIn{from{transform:scale(1.2); opacity:0}}
@keyframes tagOut{to{opacity:0}}
#hit{position:fixed; left:0; top:0; width:66px; height:66px; margin:-33px 0 0 -33px; border-radius:50%; z-index:21; touch-action:none}
#ui{position:fixed; inset:0; pointer-events:none; z-index:22}
.say{position:absolute; left:0; top:0; max-width:230px; padding:7px 11px 8px; border-radius:9px; background:rgba(10,12,24,.9); color:#e9eaf5; border:1px solid var(--pink);
  font-family:var(--f-mono); font-size:12.5px; font-weight:500; line-height:1.4; opacity:0; transition:opacity .25s}
.say::before{content:'ARAÑA'; display:block; font-size:8.5px; letter-spacing:.16em; color:var(--pink); margin-bottom:2px}
.say.on{opacity:1}
/* Pensando / Aprendiendo: una pastilla pequeña bajo la araña (0.15.0) */
.stat{position:absolute; left:0; top:0; padding:3px 10px 4px; border-radius:999px; background:var(--say-bg); color:var(--say-ink); font-size:12px; font-weight:600; letter-spacing:.03em;
  opacity:0; transition:opacity .15s; white-space:nowrap; overflow:hidden}
.stat.on{opacity:.92}
.stat i{display:inline-block; width:4px; height:4px; margin-left:3px; border-radius:50%; background:currentColor; vertical-align:middle; animation:blip .6s infinite ease-in-out}
.stat i:nth-child(2){animation-delay:.1s} .stat i:nth-child(3){animation-delay:.2s}
.stat::after{content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%); background-size:220% 100%; animation:shine .9s linear infinite}
@keyframes blip{0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:1; transform:translateY(-2px)}}
@keyframes shine{from{background-position:120% 0} to{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){ .stat i,.stat::after{animation:none} }
.chipbox{position:absolute; pointer-events:auto; display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px; border-radius:14px; background:var(--say-bg); color:var(--say-ink);
  max-width:calc(100vw - 24px); animation:pop .22s ease-out}
.chipbox p{margin:0 6px; font-family:var(--f-display); font-style:italic; font-size:17px}
.chipbox button{font:inherit; font-size:13px; font-weight:500; border:0; border-radius:10px; padding:8px 12px; background:rgba(255,255,255,.14); color:var(--say-ink)}
.chipbox button.yes{background:var(--orange); color:#0a0c15}
.chipbox{border:1px solid rgba(255,79,163,.55)}
@keyframes pop{from{opacity:0; transform:translateY(6px)}}

#sheet[hidden]{display:none}
#sheet{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.35); display:flex; align-items:flex-end}
#sheet .card{width:100%; max-height:82%; overflow:auto; background:var(--panel); color:var(--fg); border-radius:22px 22px 0 0;
  padding:18px max(18px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:16px; -webkit-user-select:text; user-select:text}
#sheet h2{margin:0; font-family:var(--f-display); font-weight:400; font-size:28px}
.seg{display:flex; border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{flex:1; text-align:center; font-size:13px; padding:8px 4px; border-radius:9px; color:var(--muted)}
.seg input:checked + label{background:var(--accent); color:var(--accent-fg)}
.note{margin:0; font-size:12.5px; color:var(--muted)}
.learned{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.learned li{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:12px}
.learned .ph{flex:1; min-width:0}
.learned .ph b{display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.learned .ph small{color:var(--muted)}
.learned .sc{font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted)}
.learned button{border:0; background:none; color:var(--muted); font:inherit; font-size:18px; padding:2px 6px}
textarea{width:100%; min-height:90px; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); resize:vertical}
.row{display:flex; gap:8px; flex-wrap:wrap}
.top .row{gap:6px; flex-wrap:nowrap}
.lvl{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.lvl b{font-family:var(--f-display); font-weight:400; font-size:24px}
.lvl small{color:var(--muted); font-variant-numeric:tabular-nums}
.xp{height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:6px}
.xp i{display:block; height:100%; background:var(--ring); border-radius:3px}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.kpis div{border:1px solid var(--line); border-radius:12px; padding:10px}
.kpis b{display:block; font-size:22px; font-weight:500; font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted); font-size:11.5px}
.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font-size:9px; font-family:var(--f-body)}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.events{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:13.5px}
.events li{display:flex; gap:8px; align-items:baseline}
.events .tag{flex:none; font-size:11px; font-weight:600; padding:1px 7px; border-radius:6px; background:var(--line); color:var(--fg)}
.events .tag.ok{background:rgba(85,122,82,.22)} .events .tag.ko{background:rgba(140,76,91,.22)} .events .tag.up{background:rgba(227,184,102,.3)}
.events span.tx{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.events time{margin-left:auto; flex:none; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.wish button{font:inherit; font-size:12.5px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:9px; padding:6px 9px; white-space:nowrap}
.wish button.sent{color:var(--muted); border-style:dashed}
@media (max-height:700px){ .tile .sq{width:48px; height:48px} .grid{gap:8px 6px} .field{gap:10px} .brand{font-size:28px} }
@media (prefers-reduced-motion: reduce){ .chipbox{animation:none} body.editing .tile .sq{animation:none!important} }
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div class="brand">Araña <small>a su servicio</small></div>
    <div class="row" id="topBtns"><button class="iconbtn" id="evo" type="button">Evolución</button><button class="iconbtn" id="gear" type="button">Ajustes</button></div>
    <div class="row" id="editBtns" hidden><button class="iconbtn" id="addApp" type="button">+ Añadir</button><button class="iconbtn on" id="editDone" type="button">Listo</button></div>
  </header>
  <section class="pager" id="pager" aria-label="Pantalla de inicio"></section>
  <div class="dots" id="dots"></div>
  <form id="bar" autocomplete="off">
    <input id="cmd" type="text" placeholder="Dígale qué hacer…" enterkeyhint="go">
    <button class="btn ghost" type="button" id="mic" aria-label="Voz"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></button>
    <button class="btn" type="submit">Ir</button>
  </form>
  <nav class="dock" id="dock" aria-label="Dock"></nav>
</main>

<canvas id="spider"></canvas>
<div id="hit" role="button" aria-label="Araña" tabindex="0"></div>
<div id="ui"><div class="say" id="say"></div><div class="stat" id="stat" aria-live="polite"></div></div>

<div id="sheet" hidden>
  <div class="card" id="sheetCard"></div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#spider'), ctx=cv.getContext('2d'), sayEl=$('#say'), statEl=$('#stat'), hit=$('#hit'), ui=$('#ui');
let W=innerWidth, H=innerHeight;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SHORTCUT='Araña';

/* ================= Datos ================= */
/* Catálogo: id|nombre (como en su iPhone)|enlace (URL scheme; vacío si no se conoce)|color|otras formas de llamarla */
const CAT_SRC=`facetime|FaceTime||#34c759|videollamada
notas|Notes|mobilenotes://|#f5c542|notas,nota
calendario|Calendar|calshow://|#f2f2f2|calendario,agenda
fotos|Photos|photos-redirect://|#f7f7f7|fotos,galeria,foto

function update(dt,t){

  for(const L of legs){
    L.hipx=S.x+L.hx*ch-L.hy*sh; L.hipy=S.y+L.hx*sh+L.hy*ch;
    const a=S.h+L.a, r=L.r*shrink, ix=S.x+Math.cos(a)*r+S.vx*.22, iy=S.y+Math.sin(a)*r+S.vy*.22;
    if(S.fl>.35){ L.st=null; L.el=null; const kk=Math.min(1,dt*14); L.fx+=(ix-L.fx)*kk; L.fy+=(iy-L.fy)*kk; continue; }

      if(L.st.t>=1){ L.st=null; if(L.el&&Math.random()<.5) flashUnder(L.el,Math.random()<.5?pal.leg:pal.joint); } continue; }
    const off=Math.hypot(L.fx-ix,L.fy-iy);

      const an=!S.hidden&&Math.random()<.7?snapTo({x:ix,y:iy}):null;
      L.el=an?an.el:null; L.slack=an?Math.hypot(an.x-ix,an.y-iy)+12:0;
      L.st={t:0,d:Math.max(.085,Math.min(.16,.16-sp*.00025)),x0:L.fx,y0:L.fy,x1:an?an.x:ix,y1:an?an.y:iy}; gb[L.g]++;

  webs=webs.filter(w=>!w.dead);
  if(carry.on){ const tx=S.x-Math.cos(S.h)*36, ty=S.y-Math.sin(S.h)*36; carry.x+=(tx-carry.x)*Math.min(1,dt*6); carry.y+=(ty-carry.y)*Math.min(1,dt*6); }

  const P=PAL[(S.user||webs.some(w=>!w.out))?'act':(S.think||S.scan>0)?'scan':'walk'], pk=Math.min(1,dt*5);
  for(const k of ['leg','joint','body']) for(let i=0;i<3;i++) pal[k][i]+=(P[k][i]-pal[k][i])*pk;
  for(const f of feelers) f.t+=dt; for(let i=feelers.length-1;i>=0;i--) if(feelers[i].t>feelers[i].life) feelers.splice(i,1);
  for(const f of flashes) f.t+=dt; for(let i=flashes.length-1;i>=0;i--) if(flashes[i].t>flashes[i].life) flashes.splice(i,1);

function ik(hx,hy,fx,fy,a,b,bend){

      const j=await r.json(), ti=(j.usage&&j.usage.input_tokens)||0, to2=(j.usage&&j.usage.output_tokens)||0;
      usage.calls++; usage.in+=ti; usage.out+=to2; const dd=dayNow(); dd.n++; dd.in+=ti; dd.out+=to2; store.set('day',dd); saveBrain();
      const t=((j.content||[]).find(x=>x.type==='text')||{}).text||'No distingo nada claro.';

function toActs(steps){
  const acts=[], bad=[];
  for(const x of steps||[]){
    if(x.type==='open'||x.type==='carry'){ const a=appById(x.app); if(a&&a.url) acts.push({t:x.type,id:a.id}); else bad.push(a?a.name:x.app); }
    else if(x.type==='set'){ const st=setById(x.setting); if(!st){ bad.push(x.setting); continue; }
      let v=String(x.value||'').toLowerCase();
      if(st.kind==='level'){ const n=parseInt(v,10); if(!(n>=1&&n<=100)){ bad.push(st.name); continue; } v=String(n); }
      else if(v!=='on'&&v!=='off') v=/(off|apag|desact|^no)/.test(v)?'off':'on';
      acts.push({t:'set',id:st.id,v}); }
    else if(x.type==='whatsapp') acts.push({t:'wa',text:x.text||''});
    else if(x.type==='pocket') acts.push({t:'pocket',text:x.text||''});
  }
  return {acts,bad};
}
/* Ejecuta lo que ha decidido el cerebro (o una rutina aprendida). Corre dentro de run(). */
async function planFlow(plan,phrase){
  (plan.forget||[]).forEach(f=>{ facts=facts.filter(x=>x.t!==f); });
  (plan.remember||[]).forEach(t=>{ t=String(t).trim(); if(t&&!facts.some(f=>f.t===t)){ facts.push({t,ts:Date.now()}); logEv('fact',null,'',{name:t}); learning(); } });
  if(facts.length>40) facts=facts.slice(-40); saveBrain();
  const {acts,bad}=plan.acts?{acts:plan.acts,bad:[]}:toActs(plan.steps);
  if(plan.routine&&plan.routine.name&&acts.length){
    [plan.routine.name,...(plan.routine.phrases||[])].map(norm).filter(Boolean).forEach(n=>{ mem[n]={steps:acts,score:1}; }); learning();
    saveAll(); logEv('learned',{t:'plan',steps:acts},norm(plan.routine.name)); checkLevel();
  }
  if(!acts.length){
    if(plan.say){ say(plan.say,Math.max(4600,plan.say.length*70)); speak(plan.say); }
    if(plan.cannot){ sad(); logEv('cant',null,phrase); addWish(phrase,plan.skill_request||plan.cannot); if(plan.skill_request) offerClaude(phrase,plan.skill_request); }
    else if((plan.remember||[]).length) happy();
    return;
  }
  if(plan.say){ say(plan.say,3000); speak(plan.say); }
  if(bad.length) setTimeout(()=>say('Me salto lo que no sé hacer: '+bad.join(', ')+'.',3200),1600);
  const t=trust(acts,phrase), ask=prefs.perm!=='nunca'&&(prefs.perm==='siempre'||!t.sure||!!plan.confirm||t.doubtful);
  if(acts.length===1&&acts[0].t!=='pocket'){ await doAction(acts[0],phrase,{forceAsk:ask,noAsk:!ask}); return; }
  if(ask){
    await wait(900);
    const v=await chips('¿Hago esto? '+acts.map((a,i)=>(i+1)+'. '+label(a)).join(' · '),[['Sí',true,'yes'],['No',false]],{x:S.x,y:S.y});
    if(!v){ say(vary('no')); logEv('cancel',{t:'plan',steps:acts},phrase); learn(phrase,acts,-1); return; }
  }
  for(let i=0;i<acts.length;i++){
    const a=acts[i]; if(abortFlag) throw ABORT;
    if(a.t==='set'&&prefs.multi){ let j=i; while(j+1<acts.length&&acts[j+1].t==='set') j++;
      if(j>i){ const grp=acts.slice(i,j+1); say('Pasos '+(i+1)+' a '+(j+1)+' de un salto: '+grp.map(label).join(', ')+'.',2600);
        const r=await doAction({t:'set',id:a.id,v:a.v,multi:grp},null,{noAsk:true,inPlan:true}); if(r==='stop'){ say('Me detengo aquí.'); return; } i=j; continue; } }
    say('Paso '+(i+1)+' de '+acts.length+': '+label(a)+'.',2200);
    if(a.t==='pocket'){ pocket=a.text; saveAll(); renderPocket(); const pk=$('#pocket'); if(pk){ await reveal(pk); const c=center(pk); await approach(c); const w=await web(c); await wait(250); release(w); } continue; }
    const r=await doAction(a,null,{noAsk:true,inPlan:true});
    if(r==='stop'){ say('Me detengo aquí.'); return; }
  }
  happy(); setTimeout(()=>askFeedback({steps:acts,phrase}),700);
}

/* ================= Iniciativa: propone, no actúa =================
   Mira el diario: si algo le ha salido bien a esta hora en 3 días distintos y hoy no lo ha hecho, lo propone. */
let muted=store.get('muted',{});
const today=()=>new Date().toISOString().slice(0,10);
function routineToSuggest(){
  const now=new Date(), h=now.getHours(), since=Date.now()-21*864e5, td=today();
  const done=new Set(log.filter(e=>new Date(e.ts).toISOString().slice(0,10)===td&&e.x).map(e=>keyOfSteps(e.x.steps||[e.x])));
  const sug=store.get('sugg',{d:'',k:[]}); const shown=sug.d===td?sug.k:[];
  const groups={};
  for(const e of log){
    if(e.r!=='ok'||!e.x||e.ts<since) continue;
    const d=new Date(e.ts), dh=Math.abs(d.getHours()-h); if(Math.min(dh,24-dh)>1) continue;
    const st=e.x.steps||[e.x], k=keyOfSteps(st);
    if(!st.length||!st.every(actOK)||st.some(a=>a.t==='carry'||a.t==='wa')) continue;
    (groups[k]=groups[k]||{st,days:new Set()}).days.add(d.toISOString().slice(0,10));
  }
  let best=null;
  for(const [k,g] of Object.entries(groups)){ if(g.days.size<3||done.has(k)||muted[k]||shown.includes(k)) continue; if(!best||g.days.size>best.n) best={k,st:g.st,n:g.days.size}; }
  return best;
}
async function proposeRoutine(){
  if(busy||overlayOpen()||pending) return;
  const b=routineToSuggest(); if(!b) return;
  const sug=store.get('sugg',{d:'',k:[]}); if(sug.d!==today()){ sug.d=today(); sug.k=[]; } sug.k.push(b.k); store.set('sugg',sug);
  S.hidden=false; S.tx=clampX(W*.6);
  const verb=a=>{ if(a.t==='open') return 'abrir '+appById(a.id).name; const x=setById(a.id); return x.kind==='level'?'poner el brillo al '+a.v+' %':(a.v==='on'?'activar ':'desactivar ')+x.name; };
  const list=b.st.map(verb), txt=list.length>1?list.slice(0,-1).join(', ')+' y '+list[list.length-1]:list[0];
  const v=await chips('A esta hora suele '+txt+'. ¿Lo hago?',[['Sí','yes','yes'],['Hoy no','no'],['No me lo proponga','mute']],{x:S.x,y:S.y}).catch(()=>null);
  if(v==='yes'){ logEv('idea',{t:'plan',steps:b.st},''); b.st.length===1?run(()=>doAction(b.st[0],null,{noAsk:true})):run(()=>planFlow({acts:b.st,say:'Enseguida.'},null)); }
  else if(v==='mute'){ muted[b.k]=1; store.set('muted',muted); say('Entendido. No se lo vuelvo a proponer.',3000); }
}

/* Hito h3: recetario de rutinas para Automatización personal de iOS.

const SITE='https://jrjr3333.github.io/arana/';
/* El enlace lleva los pasos (&a=) para que funcione aunque Safari no tenga la memoria del icono. Solo abrir apps y ajustes conocidos. */
const parseSteps=s=>String(s||'').split('+').slice(0,8).map(x=>{ const [t,id,v]=x.split(':'); return v?{t,id,v}:{t,id}; }).filter(a=>(a.t==='open'&&appById(a.id))||(a.t==='set'&&setById(a.id)&&a.v));
function exportRoutines(){
  const out=[], seen=new Set();
  const scText=st=>st.length&&st.every(a=>a.t==='set'&&setById(a.id))?st.map(a=>setById(a.id).sc+'|'+a.v).join(';'):'';
  const hourOf=k=>{ const c={}; for(const e of log) if(e.r==='ok'&&e.x&&keyOfSteps(e.x.steps||[e.x])===k){ const h=new Date(e.ts).getHours(); c[h]=(c[h]||0)+1; } const b=Object.entries(c).sort((x,y)=>y[1]-x[1])[0]; return b?+b[0]:null; };
  for(const [k,m] of Object.entries(mem)){ const st=stepsOf(m); if(m.score<1||st.length<2||!st.every(actOK)) continue; const key=keyOfSteps(st); if(seen.has(key)) continue; seen.add(key);
    out.push({name:k,steps:labelSteps(st),q:SITE+'?q='+encodeURIComponent(k)+'&a='+encodeURIComponent(key),sc:scText(st),hour:hourOf(key),kind:'rutina'}); }

  for(const e of log){ if(e.r!=='ok'||!e.x||!e.p||e.ts<since) continue; const st=e.x.steps||[e.x]; if(!st.length||!st.every(actOK)||st.some(a=>a.t==='carry'||a.t==='wa')) continue;
    const k=keyOfSteps(st); (g[k]=g[k]||{st,days:new Set(),p:e.p}).days.add(new Date(e.ts).toISOString().slice(0,10)); g[k].p=e.p; }
  for(const [k,x] of Object.entries(g)){ if(x.days.size<3||seen.has(k)) continue; seen.add(k);
    out.push({name:x.p,steps:labelSteps(x.st),q:SITE+'?q='+encodeURIComponent(x.p)+'&a='+encodeURIComponent(k),sc:scText(x.st),hour:hourOf(k),kind:'costumbre'}); }
  return out.slice(0,8);

  document.querySelectorAll('#sheet [data-ask]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ask; askClaude(k,wishes[k]&&wishes[k].why); b.textContent='Pedido'; b.classList.add('sent'); });
  $('#diary').onclick=()=>{ const d=JSON.stringify({version:VERSION.version,xp:xpNow(),nivel:levelOf(xpNow()).name,stats,mem,wishes,facts,log:log.slice(-200)},null,1);
    const p=navigator.clipboard&&navigator.clipboard.writeText(d); if(p&&p.then) p.then(()=>say('Diario copiado. Péguelo en el chat con Claude.',3600)).catch(()=>say('No he podido copiarlo.')); };
  { const rx=exportRoutines();
    document.querySelectorAll('#sheet [data-rxq]').forEach(b=>b.onclick=()=>copyText(rx[+b.dataset.rxq].q,'Enlace copiado. Péguelo en «Abrir URL» de su automatización.'));
    document.querySelectorAll('#sheet [data-avq]').forEach(b=>b.onclick=()=>copyText(avisoQ(rx[+b.dataset.avq]),'Pregunta copiada. Péguela en «Elegir del menú».'));
    document.querySelectorAll('#sheet [data-rxs]').forEach(b=>b.onclick=()=>copyText(rx[+b.dataset.rxs].sc,'Texto copiado. Péguelo como entrada de «Ejecutar atajo Araña».')); }
  $('#evClose').onclick=closeSheet;
  $('#evRate').onclick=openRatings;
  document.querySelectorAll('#sheet [data-gok]').forEach(b=>b.onclick=()=>{ goalOK[b.dataset.gok]='si'; store.set('goalOK',goalOK); b.textContent='Confirmado ✓'; say('Gracias. Se lo diré a Claude al enviar las valoraciones.',3200); });
  document.querySelectorAll('#sheet [data-gko]').forEach(b=>b.onclick=()=>{ goalOK[b.dataset.gko]='no'; store.set('goalOK',goalOK); say('Anotado. Claude lo revisará.',2600); });
}
$('#evo').onclick=openEvolution;
const TIPO={sorpresa:'Sorpresa',funcionalidad:'Función',grafica:'Gráfica','gráfica':'Gráfica',iniciativa:'Iniciativa',arreglo:'Arreglo',hito:'Hito',diseño:'Diseño',diseno:'Diseño'};
function openRatings(){
  closeMenus();
  const all=CHANGES.flatMap(v=>(v.mejoras||[]).map(m=>({...m,v:v.v}))), un=all.filter(m=>!rates[m.id]||!rates[m.id].sent), done=all.filter(m=>rates[m.id]&&rates[m.id].sent).slice(-6).reverse();
  const stars=(id,val)=>`<div class="row" style="gap:4px">${[1,2,3,4,5].map(n=>`<button type="button" class="iconbtn" data-st="${escapeHTML(id)}" data-n="${n}" style="padding:6px 9px;${val>=n?'background:var(--ring);color:#1d1a14;border-color:transparent':''}">${n}</button>`).join('')}</div>`;
  openSheet(`<h2>Valorar mejoras</h2>
    <p class="note">Puntúe de 1 a 5 cada mejora que ha hecho Claude. Con su nota decide qué seguir y qué quitar.</p>
    ${un.length?`<ul class="learned">${un.map(m=>`<li style="flex-direction:column;align-items:stretch;gap:8px"><div class="ph"><b style="white-space:normal">${escapeHTML(m.titulo)}</b><small>v${escapeHTML(m.v)} · ${escapeHTML(TIPO[m.tipo]||m.tipo||'Mejora')}${m.hito?' · hacia '+escapeHTML(m.hito):''}</small>${m.detalle?`<small style="display:block;white-space:normal">${escapeHTML(m.detalle)}</small>`:''}${m.probar?`<small style="display:block;white-space:normal">Cómo probarlo: ${escapeHTML(m.probar)}</small>`:''}</div>
      ${stars(m.id,(rates[m.id]||{}).s||0)}<input class="inp" data-cm="${escapeHTML(m.id)}" placeholder="Comentario (opcional)" value="${escapeHTML((rates[m.id]||{}).c||'')}"></li>`).join('')}</ul>`:'<p class="note">Nada pendiente de valorar.</p>'}
    ${done.length?`<div><span class="lbl">Ya valoradas</span><ul class="events">${done.map(m=>`<li><span class="tag">${rates[m.id].s}/5</span><span class="tx">${escapeHTML(m.titulo)}</span></li>`).join('')}</ul></div>`:''}
    <div class="row"><button class="btn" type="button" id="rSend">Enviar a Claude</button><button class="btn ghost" type="button" id="rClose">Cerrar</button></div>
    <p class="note">Se abre una petición en GitHub con sus notas: pulse «Create». Claude la lee en su próxima vuelta.</p>`);
  document.querySelectorAll('#sheet [data-st]').forEach(b=>b.onclick=()=>{ const id=b.dataset.st, n=+b.dataset.n; rates[id]={...(rates[id]||{}),s:n}; store.set('rates',rates);
    b.parentNode.querySelectorAll('button').forEach(x=>{ const on=+x.dataset.n<=n; x.style.background=on?'var(--ring)':''; x.style.color=on?'#1d1a14':''; x.style.borderColor=on?'transparent':''; }); });
  document.querySelectorAll('#sheet [data-cm]').forEach(i=>i.oninput=()=>{ const id=i.dataset.cm; rates[id]={...(rates[id]||{}),c:i.value}; store.set('rates',rates); });
  $('#rClose').onclick=closeSheet;
  $('#rSend').onclick=()=>{
    const items=un.filter(m=>rates[m.id]&&rates[m.id].s).map(m=>({id:m.id,v:m.v,titulo:m.titulo,nota:rates[m.id].s,comentario:rates[m.id].c||''}));
    const hitos=Object.entries(goalOK).map(([id,r])=>({id,funciona:r==='si'}));
    if(!items.length&&!hitos.length){ say('Puntúe al menos una mejora.',2600); return; }
    const L=levelOf(xpNow()), st={ok:log.filter(e=>e.r==='ok').length,ko:log.filter(e=>e.r==='ko').length};
    const body=['**Valoraciones de Juan**','',...items.map(i=>'- '+'★'.repeat(i.nota)+'☆'.repeat(5-i.nota)+' '+i.titulo+' (v'+i.v+')'+(i.comentario?' — «'+i.comentario+'»':'')),
      ...(hitos.length?['','**Hitos**',...hitos.map(h=>'- '+h.id+': '+(h.funciona?'funciona ✓':'no funciona ✗'))]:[]),
      '','**Uso**',`- Nivel ${L.name}, ${xpNow()} XP · aciertos/fallos ${st.ok}/${st.ko} · consultas al cerebro ${usage.calls}`,
      '','```json',JSON.stringify({version:VERSION.version,valoraciones:items,hitos},null,0),'```'].join('\n');
    const url=`https://github.com/${REPO}/issues/new?labels=valoracion&title=${encodeURIComponent('Valoraciones '+VERSION.version+' · '+new Date().toLocaleDateString('es-ES'))}&body=${encodeURIComponent(body)}`;
    try{ window.open(url,'_blank'); }catch(e){ location.href=url; }
    items.forEach(i=>{ rates[i.id].sent=true; }); store.set('rates',rates); goalOK={}; store.set('goalOK',goalOK);
    logEv('req',null,'valoraciones '+items.length); closeSheet(); happy(); say('Pulse «Create» en GitHub. Gracias por enseñarme.',3600);
  };
}
/* Novedades: si Claude ha publicado una versión nueva, la araña lo cuenta */
fetch('version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{
  if(!v||!v.version) return;
  const prev=VERSION.version, isNew=v.version!==prev && !first;
  VERSION=v; store.set('ver',v);
  if(isNew){ logEv('update',null,'',{v:v.version}); setTimeout(()=>{ happy(); say('Me han actualizado a la '+v.version+'. '+((v.notes&&v.notes[0])||''),5200); },3200); }
}).catch(()=>{});

/* ================= Tocar y arrastrar la araña ================= */
let pd=null;
hit.addEventListener('pointerdown',e=>{ hit.setPointerCapture(e.pointerId); pd={x:e.clientX,y:e.clientY,moved:false,t:performance.now()}; });
hit.addEventListener('pointermove',e=>{
  if(!pd) return;
  if(!pd.moved&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>7&&!busy){ pd.moved=true; S.user=true; S.hidden=false; S.fl=0; closeMenus(); }
  if(pd.moved){ const nx=clampX(e.clientX), ny=clampY(e.clientY), now=performance.now(), dt=Math.max(.008,(now-pd.t)/1000); pd.t=now;
    S.vx=S.vx*.6+((nx-S.x)/dt)*.4; S.vy=S.vy*.6+((ny-S.y)/dt)*.4; S.x=S.tx=nx; S.y=S.ty=ny; }
});
hit.addEventListener('pointerup',()=>{
  if(!pd) return; const drag=pd.moved; pd=null; lastActive=performance.now();
  if(drag){ S.user=false; S.vx=S.vy=0; S.tx=S.x; S.ty=S.y; return; }
  if(busy){ abortFlag=true; if(pendingChip) pendingChip.done(ABORT); return; }
  if(follow){ setFollow(false); return; }
  if(tripleTap()) return dance();
  if(S.hidden){ S.hidden=false; S.tx=S.x<W/2?64:W-64; say('¿Sí?'); setTimeout(spiderMenu,600); return; }
  pendingChip?closeChip():spiderMenu();
});
hit.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); spiderMenu(); } });
/* Sorpresa 0.9.0: tres toques rápidos y la araña baila. Se quita borrando este bloque y su línea en pointerup. */
let taps=[];
function tripleTap(){ const n=performance.now(); taps=taps.filter(t=>n-t<900); taps.push(n); if(taps.length<3) return false; taps=[]; return true; }
const DANCE=['Un pasito de baile, con permiso.','Ocho patas, ocho compases.','Esto es un zapateado arácnido.','Bailo poco, pero bailo bien.','Que no se entere nadie.'];
function dance(){ closeChip();
  run(async()=>{ const x0=S.x, y0=S.y, t=pick(DANCE); say(t,3200); speak(t);
    for(let i=0;i<6;i++){ await moveTo(x0+(i%2?-30:30),y0+(i%3===0?-16:0)); happy(); }
    await moveTo(x0,y0); S.nod=1; }); }
function spiderMenu(){
  if(busy) return;
  const opts=[['Evolución','evo'],['Bolsillo','pocket'],['Ajustes','settings']];
  if(pocket) opts.unshift(['Llevar bolsillo a…','carry']);
  chips(null,[...opts,['×',null]],{x:S.x,y:S.y}).then(v=>{
    if(v==='evo') openEvolution();
    else if(v==='pocket') fillPocket();
    else if(v==='settings') openSettings();
    else if(v==='carry') chips('¿A dónde?',[...APPS.filter(a=>TXT_APPS.includes(a.id)&&a.url).map(a=>[a.name,a.id]),['×',null]],{x:S.x,y:S.y}).then(id=>{ if(id) run(()=>doAction({t:'carry',id},null)); }).catch(()=>{});
  }).catch(()=>{});
}

/* ================= Arranque ================= */
resize(); S.x=S.tx=W*.68; S.y=S.ty=H*.62; initLegs(); requestAnimationFrame(frame);
const first=!store.get('seen',false); store.set('seen',true);
// h2 · «Oye Siri, Araña»: el atajo «Araña voz» abre la web con ?q=orden y la ejecuto al cargar.
// Se borra de la dirección enseguida para que una recarga no la repita.
let Q0='', A0=''; try{ const u=new URL(location.href); Q0=(u.searchParams.get('q')||'').trim().slice(0,200); A0=(u.searchParams.get('a')||'').slice(0,400); if(u.searchParams.has('q')||u.searchParams.has('a')){ u.searchParams.delete('q'); u.searchParams.delete('a'); history.replaceState(null,'',u.pathname+(u.search||'')+u.hash); } }catch(e){}
if(Q0){ setTimeout(()=>{ say('«'+Q0+'». Voy.',1800); logEv('voz',null,Q0.slice(0,60)); setTimeout(()=>{ const l=norm(Q0), st=parseSteps(A0), m=mem[l]; if(st.length&&!(m&&m.score>=1)) st.length===1?run(()=>doAction(st[0],l)):run(()=>planFlow({acts:st,say:'Enseguida.'},l)); else interpret(Q0); },900); },500); }
else { setTimeout(()=>say(first?'Buenas. Soy su araña. Dígame qué hacer o toque una estación.':vary('hola'),first?4200:2600),700);
setTimeout(async()=>{ if(first) return; if(!(await offerBrief())) proposeRoutine(); },5200); }
setTimeout(()=>resolveIcons(false),1500); setInterval(()=>resolveIcons(false),6*36e5);
loadRepoData();
setTimeout(async()=>{
  if(first||Q0||busy||overlayOpen()||pending||!roll(.7)) return;
  const sd=store.get('surpDay',''), td=new Date().toISOString().slice(0,10); if(sd===td&&!roll(.3)) return;
  const ideas=[
    ()=>({q:'¿Quiere un dato curioso sobre arañas?',go:()=>{ const c=pick(CURIOS); say(c,6000); speak(c); }}),
    ()=>({q:'Se me ha ocurrido una rutina nueva para usted. ¿La invento?',go:()=>interpret('invéntate una rutina útil para mí con lo que sabes de mí, bautízala con un nombre original y propónmela'),brain:true}),
    ()=>({q:'Reto del día: pídame algo que nunca me haya pedido. ¿Acepta?',go:()=>{ say('Le escucho. Sorpréndame usted a mí.',3600); $('#cmd').focus(); }}),
    ()=>({q:'¿Le cuento qué he aprendido de usted hasta ahora?',go:()=>openEvolution()}),
    ()=>({q:'¿Me deja reordenar su primera página a mi gusto? Lo puede deshacer.',go:()=>{ say('Mejor no toco nada sin un plan. Mantenga pulsado un icono y lo hacemos juntos.',4200); }}),
    ()=>{ const Q=[['¿Qué música le acompaña más?',['Pop','Rock','Urbana','Clásica'],'Su música: '],['¿Café o té por la mañana?',['Café','Té','Ninguno'],'Por la mañana toma: '],['¿Qué deporte sigue?',['Fútbol','Baloncesto','Tenis','Ninguno'],'Deporte que sigue: '],['¿Es usted de madrugar o de trasnochar?',['Madrugar','Trasnochar'],'Prefiere: ']].filter(q=>!facts.some(f=>f.t.startsWith(q[2])));
      if(!Q.length) return {q:'',go:()=>{},brain:true,none:true}; const q=pick(Q);
      return {q:'Me intereso por usted: '+q[0].toLowerCase()+' ¿Se lo pregunto?',go:async()=>{ const v=await chips(q[0],q[1].map(o=>[o,o]),{x:S.x,y:S.y}).catch(()=>null); if(!v) return; facts.push({t:q[2]+v.toLowerCase()+'.',ts:Date.now()}); saveBrain(); learning(); say(pick(['Anotado. Ya le conozco un poco más.','Lo guardo con hilo fino.','Interesante. Lo recordaré.']),3200); }}; },
    ()=>({q:'Tengo una pregunta para conocerle mejor. ¿Me la contesta?',go:()=>interpret('hazme una pregunta corta y original para conocerme mejor y recordar la respuesta'),brain:true})
  ].map(f=>f()).filter(i=>!i.none&&(!i.brain||(brainReady()&&!capReached())));
  if(!ideas.length) return;
  const it=pick(ideas); store.set('surpDay',td);
  const v=await chips(it.q,[['Sí','y','yes'],['Ahora no',null]],{x:S.x,y:S.y}).catch(()=>null);
  logEv('idea',null,it.q.slice(0,60)); if(v==='y') it.go();
},16000);
setTimeout(async()=>{ if(first||Q0||busy||overlayOpen()) return; const n=unrated().length; if(!n||sessionStorage.getItem('askedRate')) return;
  try{ sessionStorage.setItem('askedRate','1'); }catch(e){}
  const v=await chips('Claude me ha mejorado: '+n+' cambio'+(n===1?'':'s')+' nuevo'+(n===1?'':'s')+'. ¿Los valora?',[['Valorar','go','yes'],['Luego',null]],{x:S.x,y:S.y}).catch(()=>null);
  if(v==='go') openRatings(); },11000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
// Al volver a la app se recarga para traer siempre la última versión.
// No se recarga si acaba de abrir otra app (para poder preguntar si salió bien) ni si está trabajando.
let hiddenAt=0, skipReload=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); skipReload=!!pending||busy||thinking; return; }
  if(!hiddenAt||skipReload||busy||pending||Date.now()-hiddenAt<3000) return;
  location.reload();
});
window.addEventListener('pageshow',e=>{ if(e.persisted&&!pending&&!busy) location.reload(); });
