<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Araña">
<meta name="theme-color" content="#090a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Araña</title>
<style>
/* 0.22.0: la misma pantalla que la app de iPhone (nativo/ios/Arana/ContentView.swift) en la web y en Android.
   Fondo del prototipo, telaraña que crece, bocadillo, la araña, y abajo micro, campo e «Ir». Todo lo demás vive en Ajustes. */
:root{
  --home:#090a14; --pink:#ff4fa3; --green:#3dff99; --cyan:#5ee8ff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  /* Colores de sistema de iOS (claro) para el campo, los botones y la hoja de Ajustes */
  --tint:#007aff; --red:#ff3b30; --okc:#34c759;
  --sheet:#f2f2f7; --cell:#ffffff; --fg:#000000; --muted:rgba(60,60,67,.6); --line:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12);
  --field:#ffffff; --field-ink:#000; --field-line:rgba(60,60,67,.29);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --tint:#0a84ff; --red:#ff453a; --okc:#30d158;
    --sheet:#1c1c1e; --cell:#2c2c2e; --fg:#ffffff; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
    --field:#1c1c1e; --field-ink:#fff; --field-line:rgba(84,84,88,.65) }
}
/* Colores de las gráficas de Evolución */
:root{ --app-1:var(--tint); --app-3:var(--okc); --app-4:var(--red); --ring:#ff9f0a; --bg:var(--fill) }
*{box-sizing:border-box}
html,body{height:100%; margin:0}
/* 0.23.0: el cuerpo no se mueve nunca; con el teclado abierto #app se ajusta a lo que queda visible (visualViewport) */
body{position:fixed; inset:0; background:var(--home); color:#fff; font-family:var(--sys); font-size:17px; line-height:1.3; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; -webkit-touch-callout:none}
/* Wallpaper(): rejilla fina y brillos violeta y verde azulado */
#wall{position:fixed; inset:0; background:
  repeating-linear-gradient(0deg,rgba(94,232,255,.05) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgba(94,232,255,.05) 0 1px,transparent 1px 28px),
  radial-gradient(420px circle at 15% 5%,#33205e,transparent),
  radial-gradient(420px circle at 95% 95%,#0e4152,transparent),var(--home)}
#tela{position:fixed; inset:0; width:100%; height:100%; pointer-events:none}
#app{position:fixed; left:0; right:0; top:var(--vt,0px); height:var(--vh,100%); display:flex; flex-direction:column; align-items:center; gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.top{align-self:stretch; display:flex; justify-content:flex-end; gap:14px; padding:0 16px}
.top button{border:0; background:none; padding:4px; color:rgba(255,255,255,.8); line-height:0}
.grow{flex:1; min-height:0}
#say{max-width:min(560px,calc(100% - 32px)); margin:0 16px; padding:14px; border-radius:10px; border:1px solid var(--pink);
  background:rgba(10,13,23,.9); color:#fff; text-align:center; font:500 16px/1.35 var(--mono); white-space:pre-line;
  max-height:38vh; overflow:auto; -webkit-user-select:text; user-select:text}
/* El nido: el sitio de la araña en el centro. La araña camina libre por toda la pantalla (#cv) y vuelve aquí. */
#nest{width:240px; height:240px; flex:none; pointer-events:none; transition:height .2s}
#cv{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20}
#hit{position:fixed; left:0; top:0; width:72px; height:72px; margin:-36px 0 0 -36px; border-radius:50%; z-index:21; touch-action:none; -webkit-touch-callout:none}
#hit:focus-visible{outline:2px solid var(--cyan); outline-offset:4px}
.tagbox{position:fixed; z-index:19; pointer-events:none; border:1.5px solid var(--cyan); border-radius:6px; box-shadow:0 0 12px -2px var(--cyan); animation:tagIn .2s ease-out, tagOut .4s ease-in 1.5s forwards}
.tagbox b{position:absolute; bottom:100%; left:-1.5px; margin-bottom:3px; font:600 9.5px/1 var(--mono); letter-spacing:.06em; color:#0a0c15; background:var(--cyan); padding:3px 6px; border-radius:3px; white-space:nowrap}
.tagbox.pink{border-color:var(--pink); box-shadow:0 0 12px -2px var(--pink)} .tagbox.pink b{background:var(--pink)}
.tagbox.orange{border-color:#ff9a3d; box-shadow:0 0 12px -2px #ff9a3d} .tagbox.orange b{background:#ff9a3d}
.tagbox.green{border-color:var(--green); box-shadow:0 0 12px -2px var(--green)} .tagbox.green b{background:var(--green)}
@keyframes tagIn{from{opacity:0; transform:scale(1.08)}} @keyframes tagOut{to{opacity:0}}
/* Teclado abierto: todo más compacto para que nada se corte */
body.kb #app{gap:8px; padding-top:calc(env(safe-area-inset-top,0px) + 2px)}
body.kb #nest{height:120px}
body.kb #hit{pointer-events:none}
body.kb #say{max-height:24vh; padding:10px; font-size:15px}
body.kb #bar{padding:8px 16px}
#thinking{font-size:12px; font-weight:700; color:rgba(255,255,255,.8); margin-top:-10px}
#ear{font-size:16px; color:rgba(255,255,255,.85); padding:0 16px; text-align:center}
#choices{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:0 16px; max-width:600px}
.choice{font:inherit; font-size:15px; border:0; border-radius:8px; padding:7px 14px; background:rgba(61,255,153,.16); color:var(--green)}
.choice.yes{background:var(--tint); color:#fff}
#bar{align-self:center; width:100%; max-width:640px; display:flex; align-items:center; gap:8px; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
body.kb #bar{padding-bottom:8px}
#mic{border:0; background:none; padding:0; width:34px; height:34px; flex:none; color:#fff; line-height:0}
#mic.on{color:#ff3b30}
#cmd{flex:1; min-width:0; height:34px; padding:0 8px; font:inherit; font-size:17px; border-radius:6px; border:.5px solid var(--field-line);
  background:var(--field); color:var(--field-ink); -webkit-user-select:text; user-select:text}
#cmd:focus{outline:none}
#go{flex:none; height:34px; padding:0 14px; border:0; border-radius:7px; background:var(--tint); color:#fff; font:inherit; font-size:17px; font-weight:500}
#bar button:disabled{opacity:.4}
[hidden]{display:none!important}
@keyframes hop{30%{transform:translateY(-10px)} 60%{transform:translateY(0)} 80%{transform:translateY(-3px)}}
@keyframes sag{40%{transform:translateY(6px) scale(.97)}}
@keyframes nod{40%{transform:rotate(-4deg)}}

/* ===== Ajustes: una hoja como la de iOS (Form agrupado) ===== */
#sheet{position:fixed; left:0; right:0; top:var(--vt,0px); height:var(--vh,100%); z-index:30; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center}
#sheet .wrap{width:100%; max-width:700px; height:calc(100% - env(safe-area-inset-top,0px) - 14px); background:var(--sheet); color:var(--fg);
  border-radius:12px 12px 0 0; display:flex; flex-direction:column; animation:up .28s ease-out; -webkit-user-select:text; user-select:text}
@keyframes up{from{transform:translateY(40px); opacity:.4}}
@media (prefers-reduced-motion: reduce){ #sheet .wrap{animation:none} }
.nav{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px; min-height:44px}
.nav button{border:0; background:none; color:var(--tint); font:inherit; font-size:17px; padding:4px 0}
.nav b{font-weight:600}
#sheetCard{flex:1; overflow:auto; padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px); display:flex; flex-direction:column; gap:22px; font-size:17px}
#sheet h2{margin:0 0 -6px; font-size:34px; font-weight:700; letter-spacing:.01em}
#sheetCard > div:not(.row){background:var(--cell); border-radius:10px; padding:11px 16px}
.lbl{display:block; font-size:13px; letter-spacing:0; text-transform:uppercase; color:var(--muted); font-weight:400; margin:0 0 8px}
.note{margin:0; font-size:13px; color:var(--muted); line-height:1.35}
.note a{color:var(--tint)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{font:inherit; font-size:17px; font-weight:500; border:0; border-radius:10px; padding:11px 16px; background:var(--tint); color:#fff; text-decoration:none}
.btn.ghost{background:var(--fill); color:var(--tint); font-weight:400}
.btn.warn{background:var(--fill); color:var(--red); font-weight:400}
.iconbtn{font:inherit; font-size:15px; border:0; border-radius:8px; padding:6px 12px; background:var(--fill); color:var(--tint)}
.inp,textarea,#apikey{width:100%; font:inherit; font-size:17px; padding:9px 0; border:0; border-bottom:.5px solid var(--line); background:transparent; color:var(--fg); border-radius:0}
.inp:focus,textarea:focus,#apikey:focus{outline:none}
textarea{min-height:110px; resize:vertical; border:0}
/* Filas de lista con separador, como un Form */
.cells{list-style:none; margin:0; padding:0}
.cells li{display:flex; align-items:center; gap:10px; min-height:44px; padding:6px 0; border-bottom:.5px solid var(--line)}
.cells li:last-child{border-bottom:0}
.cells li > span{flex:1; min-width:0}
.cells small{display:block; color:var(--muted); font-size:13px}
.cells .val{color:var(--muted); flex:none}
.cells .go{flex:1; display:flex; align-items:center; gap:10px; border:0; background:none; font:inherit; color:var(--fg); padding:0; text-align:left; min-height:32px}
.cells .go::after{content:'›'; margin-left:auto; color:var(--muted); font-size:22px; line-height:1}
.cells .go > span:first-child{flex:1}
.cells .go .val{margin-right:4px}
.cells .act{border:0; background:none; font:inherit; color:var(--tint); padding:0; text-align:left; min-height:32px}
.cells .act.warn{color:var(--red)}
.badge{min-width:22px; height:22px; padding:0 7px; border-radius:11px; background:var(--red); color:#fff; font-size:14px; line-height:22px; text-align:center}
.cap::before{content:'✓'; color:var(--okc); font-weight:700; margin-right:8px}
.cap.no::before{content:'—'; color:var(--muted)}
.cap.no{color:var(--muted)}
/* Interruptor de iOS */
.sw{position:relative; width:51px; height:31px; flex:none}
.sw input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.sw i{position:absolute; inset:0; border-radius:16px; background:var(--fill); transition:background .2s; pointer-events:none}
.sw i::after{content:''; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:transform .2s}
.sw input:checked + i{background:var(--okc)}
.sw input:checked + i::after{transform:translateX(20px)}
/* Control segmentado */
.seg{display:flex; background:var(--fill); border-radius:9px; padding:2px; gap:2px}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{flex:1; text-align:center; font-size:13px; font-weight:500; padding:6px 4px; border-radius:7px; color:var(--fg)}
.seg input:checked + label{background:var(--cell); box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (prefers-color-scheme: dark){ .seg input:checked + label{background:#636366} }
/* Evolución */
.charla{display:flex; flex-direction:column; gap:8px; background:none!important; padding:0!important}
.charla p{margin:0; max-width:84%; padding:8px 12px; border-radius:16px; font-size:16px; line-height:1.3; white-space:pre-wrap; word-wrap:break-word}
.charla .u{align-self:flex-end; background:#0a84ff; color:#fff; border-bottom-right-radius:4px}
.charla .a{align-self:flex-start; background:var(--cell); border-bottom-left-radius:4px}
.charla small{align-self:center; opacity:.55; font-size:12px}
.charlaIn{position:sticky; bottom:0; display:flex; gap:8px; background:var(--sheet)!important; padding:8px 0!important}
.charlaIn input{flex:1; min-width:0; font-size:17px; padding:9px 12px; border-radius:18px; border:.5px solid var(--line); background:var(--cell); color:var(--fg)}
.charlaIn button{border:0; border-radius:18px; padding:0 16px; background:#0a84ff; color:#fff; font-size:17px}
.learned{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.learned li{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:.5px solid var(--line)}
.learned li:last-child{border-bottom:0}
.learned .ph{flex:1; min-width:0}
.learned .ph b{display:block; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.learned .ph small{color:var(--muted); font-size:13px}
.learned .sc{font-variant-numeric:tabular-nums; font-size:15px; color:var(--muted)}
.learned button{border:0; background:none; color:var(--muted); font:inherit; font-size:20px; padding:2px 6px}
.lvl{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.lvl b{font-size:22px; font-weight:600}
.lvl small{color:var(--muted); font-variant-numeric:tabular-nums}
.xp{height:6px; border-radius:3px; background:var(--fill); overflow:hidden; margin-top:6px}
.xp i{display:block; height:100%; background:var(--tint); border-radius:3px}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
#sheetCard .kpis{background:none!important; padding:0!important}
.kpis div{background:var(--cell); border-radius:10px; padding:10px 12px}
.kpis b{display:block; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted); font-size:12px}
.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font-size:9px; font-family:var(--sys)}
.legend{display:flex; gap:14px; font-size:13px; color:var(--muted); margin-top:4px}
.legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.events{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:15px}
.events li{display:flex; gap:8px; align-items:baseline}
.events .tag{flex:none; font-size:12px; font-weight:600; padding:1px 7px; border-radius:6px; background:var(--fill); color:var(--fg)}
.events .tag.ok{background:rgba(52,199,89,.22)} .events .tag.ko{background:rgba(255,59,48,.2)} .events .tag.up{background:rgba(255,159,10,.25)}
.events span.tx{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.events time{margin-left:auto; flex:none; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.wish button{font:inherit; font-size:14px; border:0; background:var(--fill); color:var(--tint); border-radius:8px; padding:6px 10px; white-space:nowrap}
.wish button.sent{color:var(--muted)}
/* 0.24.0: la sala de partidas de ajedrez ocupa toda la pantalla, encima de todo */
#ajz{position:fixed; inset:0; width:100%; height:100%; border:0; z-index:60; background:var(--home)}
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>
<canvas id="tela" aria-hidden="true"></canvas>
<main id="app">
  <div class="top"><button id="chessBtn" type="button" aria-label="Ajedrez"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M8 18h8"/><path d="M9 18c0-3 1-5 2.5-7L9 12l-1.5-2L11 5.5V3l2 1.5c3 1 5 4 5 8.5 0 2-.5 3.7-1 5"/><circle cx="12.2" cy="7.6" r=".5" fill="currentColor"/></svg></button><button id="gear" type="button" aria-label="Ajustes"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  <div class="grow"></div>
  <div id="say" aria-live="polite"></div>
  <div id="nest" aria-hidden="true"></div>
  <div id="thinking" hidden>Pensando…</div>
  <div id="ear" hidden>Escuchando…</div>
  <div id="choices" hidden></div>
  <div class="grow"></div>
  <form id="bar" autocomplete="off">
    <button id="mic" type="button" aria-label="Hablar"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="currentColor"/><g fill="#090a14"><rect x="13.6" y="7.6" width="6.8" height="12" rx="3.4"/><path d="M10.6 16.2a1 1 0 0 1 2 0 4.4 4.4 0 0 0 8.8 0 1 1 0 0 1 2 0 6.4 6.4 0 0 1-5.4 6.32V25h2.2a1 1 0 0 1 0 2h-6.4a1 1 0 0 1 0-2H16v-2.48a6.4 6.4 0 0 1-5.4-6.32z"/></g><rect class="stop" x="11" y="11" width="12" height="12" rx="2" fill="#fff" hidden/></svg></button>
    <input id="cmd" type="text" placeholder="Dígame qué hacer" enterkeyhint="go" autocapitalize="sentences">
    <button id="go" type="submit">Ir</button>
  </form>
</main>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="hit" role="button" aria-label="La araña. Toque para hablar; tres toques, baila; mantenga pulsado, menú; arrástrela para moverla." tabindex="0"></div>

<div id="sheet" hidden>
  <div class="wrap" role="dialog" aria-modal="true" aria-label="Ajustes">
    <div class="nav"><button type="button" id="back" hidden>‹ Atrás</button><span></span><button type="button" id="done"><b>Listo</b></button></div>
    <div id="sheetCard"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SHORTCUT='Araña';

/* ================= Dónde vivo y qué puedo hacer aquí =================
   Una sola pantalla en todas partes; lo que cambia es lo que el móvil me deja hacer.
   - android: mi app de Android (nativo/android). Hace más que nadie: ajustes, temporizadores, alarmas, música, citas, flotar…
   - ios: la web en el iPhone. Abre apps por su enlace y cambia ajustes con el atajo «Araña».
   - web: un navegador cualquiera. Contesto, pienso y guardo en el bolsillo. */
const UA=navigator.userAgent||'';
const IN_APK=new URLSearchParams(location.search).get('app')==='android'||(/Android/.test(UA)&&/; wv\)/.test(UA));
const ON_ANDROID=IN_APK||/Android/.test(UA);
const ON_IOS=!ON_ANDROID&&(/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1));
const AND=()=>window.AranaAndroid||null;
// La app de Android 0.22.0 trae el puente «orden»; la 0.21.0 solo entiende enlaces arana:// sencillos.
const BRIDGE2=IN_APK&&!!(AND()&&AND().orden);
/* 0.42.0: la versión de mi app de Android (desde la 0.42.0 la dice ella). Sin firma propia, Android no dejaba
   actualizar encima y Juan seguía con una app vieja: por eso «no abre, no habla, no escucha». */
const APK_V=(()=>{ try{ const b=AND(); return IN_APK&&b&&b.version?String(b.version()||''):''; }catch(e){ return ''; } })();
const APK_URL='https://github.com/JRJR3333/arana/releases/download/android/arana.apk';
const APK_MIN='0.46.0', vNum=v=>String(v||'0').split('.').map(Number).reduce((a,x)=>a*1000+(x||0),0);
const APK_OLD=IN_APK&&(!APK_V||vNum(APK_V)<vNum(APK_MIN));
/* 0.45.0: lo que sabe hacer mi app de Android (voz, whatsapp con contacto, oído propio). Una app vieja no lo dice. */
const APK_CAP=(()=>{ try{ const b=AND(); return IN_APK&&b&&b.capacidades?String(b.capacidades()||'').split(','):[]; }catch(e){ return []; } })();
const apkCan=c=>APK_CAP.includes(c);
const PLAT=IN_APK?'android':ON_IOS?'ios':'web';
const CAPS={

function issueURL(phrase,why){

  ].join('\n');

let ghTok=store.get('gh','');
async function fileIssue(phrase,why){
  const u=new URL(issueURL(phrase,why)), title=u.searchParams.get('title'), body=u.searchParams.get('body');
  const r=await fetch('https://api.github.com/repos/'+REPO+'/issues',{method:'POST',headers:{'Authorization':'Bearer '+ghTok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({title,body,labels:['nueva-habilidad']})});
  if(!r.ok) throw new Error(r.status+' '+(await r.text().catch(()=>'')).slice(0,120));
  return (await r.json()).number;
}

function askClaude(phrase,why){
  if(ghTok){ fileIssue(phrase,why).then(n=>{ markSent(phrase); happy(); learning(); say('Se lo he pedido a Claude (petición '+n+'). Cuando lo aprenda, se lo diré.'); })
    .catch(e=>{ console.warn(e); say(/401|403/.test(String(e))?'Mi token de GitHub no vale. Revíselo en Ajustes.':'No he podido pedírselo a Claude ahora. Lo intento otro día.'); }); return; }
  try{ window.open(issueURL(phrase,why),'_blank'); }catch(e){ location.href=issueURL(phrase,why); }

function parseWhen(w){ const m=String(w||'').match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/); if(!m) return null; const d=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||9),+(m[5]||0)); return isNaN(d)?null:d; }
function toActs(steps){
  const acts=[], bad=[];
  for(const x of steps||[]){
    if(x.type==='open'||x.type==='carry'){ const a=appById(x.app)||(x.type==='open'?adhocApp(x.app):null); if(a&&canOpen(a)&&CAPS[x.type]) acts.push({t:x.type,id:a.id}); else bad.push(a?a.name:x.app); }
    else if(x.type==='set'){ const st=setById(x.setting); if(!st||!CAPS.set){ bad.push(st?st.name:x.setting); continue; }

    else if(x.type==='call'&&CAPS.call&&x.to&&apkCan('contacto')) acts.push({t:'call',to:String(x.to)});
    else if(x.type==='message'&&CAPS.message&&!telOf(x.phone)&&x.to&&apkCan('contacto')) acts.push({t:'msg',to:String(x.to),text:x.text||''});
    else if(x.type==='message'&&CAPS.message) acts.push({t:'msg',phone:telOf(x.phone),text:x.text||''});
    else if(x.type==='timer'&&CAPS.timer){ const s=(+x.minutes||0)*60+(+x.seconds||0); if(s>0) acts.push({t:'timer',s,text:x.text||''}); else bad.push('temporizador'); }

/* Ejecuta lo que ha decidido el cerebro (o una rutina aprendida). Corre dentro de run(). */
async function planFlow(plan,phrase){
  (plan.forget||[]).forEach(f=>{ facts=facts.filter(x=>x.t!==f); });
  (plan.remember||[]).forEach(t=>{ t=String(t).trim(); if(t&&!facts.some(f=>f.t===t)){ facts.push({t,ts:Date.now()}); logEv('fact',null,'',{name:t}); learning(); } });
  if(facts.length>40) facts=facts.slice(-40); saveBrain();
  const {acts,bad}=plan.acts?{acts:plan.acts,bad:[]}:toActs(plan.steps);
  if(plan.routine&&plan.routine.name&&acts.length){
    [plan.routine.name,...(plan.routine.phrases||[])].map(norm).filter(Boolean).forEach(n=>{ mem[n]={steps:acts,score:1}; }); learning();
    saveAll(); logEv('learned',{t:'plan',steps:acts},norm(plan.routine.name)); checkLevel();
  }
  if(!acts.length){
    if(plan.say){ say(plan.say); speak(plan.say); }
    if(plan.cannot){ sad(); logEv('cant',null,phrase); addWish(phrase,plan.skill_request||plan.cannot); offerClaude(phrase,plan.skill_request||plan.cannot); }
    else { addThread(); if((plan.remember||[]).length) happy(); }
    return;
  }
  if(plan.say){ say(plan.say); speak(plan.say); }
  // 0.23.0: si solo es moverme (bailar, pasear…), lo hago sin preguntar ni pedir nota
  if(acts.every(a=>a.t==='spider')){ for(const a of acts){ if(abortFlag) throw ABORT; await MOVES[a.v](!!plan.say); } addThread(); return; }
  if(bad.length) setTimeout(()=>say('Me salto lo que no sé hacer aquí: '+bad.join(', ')+'.'),1600);
  const t=trust(acts,phrase), ask=prefs.perm!=='nunca'&&(prefs.perm==='siempre'||!t.sure||!!plan.confirm||t.doubtful);
  if(acts.length===1&&acts[0].t!=='pocket'){ await doAction(acts[0],phrase,{forceAsk:ask,noAsk:!ask}); return; }
  if(ask){
    await wait(900);
    const v=await chips('¿Hago esto? '+acts.map((a,i)=>(i+1)+'. '+label(a)).join(' · '),[['Sí',true,'yes'],['No',false]]);
    if(!v){ say(vary('no')); logEv('cancel',{t:'plan',steps:acts},phrase); learn(phrase,acts,-1); return; }
  }
  for(let i=0;i<acts.length;i++){
    const a=acts[i]; if(abortFlag) throw ABORT;
    if(a.t==='set'&&prefs.multi&&ON_IOS){ let j=i; while(j+1<acts.length&&acts[j+1].t==='set') j++;
      if(j>i){ const grp=acts.slice(i,j+1); say('Pasos '+(i+1)+' a '+(j+1)+' de un salto: '+grp.map(label).join(', ')+'.');
        const r=await doAction({t:'set',id:a.id,v:a.v,multi:grp},null,{noAsk:true,inPlan:true}); if(r==='stop'){ say('Me detengo aquí.'); return; } i=j; continue; } }
    say('Paso '+(i+1)+' de '+acts.length+': '+label(a)+'.');
    if(a.t==='pocket'){ pocket=a.text; saveAll(); await wait(500); continue; }
    const r=await doAction(a,null,{noAsk:true,inPlan:true});
    if(r==='stop'){ say('Me detengo aquí.'); return; }
    await wait(600);
  }
  happy(); setTimeout(()=>askFeedback({steps:acts,phrase}),700);
}

const noRepeat=a=>a.t!=='open'&&a.t!=='set';
let muted=store.get('muted',{});
const today=()=>new Date().toISOString().slice(0,10);
function routineToSuggest(){
  const now=new Date(), h=now.getHours(), since=Date.now()-21*864e5, td=today();
  const done=new Set(log.filter(e=>new Date(e.ts).toISOString().slice(0,10)===td&&e.x).map(e=>keyOfSteps(e.x.steps||[e.x])));
  const sug=store.get('sugg',{d:'',k:[]}); const shown=sug.d===td?sug.k:[];
  const groups={};
  for(const e of log){
    if(e.r!=='ok'||!e.x||e.ts<since) continue;
    const d=new Date(e.ts), dh=Math.abs(d.getHours()-h); if(Math.min(dh,24-dh)>1) continue;
    const st=e.x.steps||[e.x], k=keyOfSteps(st);
    if(!st.length||!st.every(actOK)||st.some(noRepeat)) continue;
    (groups[k]=groups[k]||{st,days:new Set()}).days.add(d.toISOString().slice(0,10));
  }
  let best=null;
  for(const [k,g] of Object.entries(groups)){ if(g.days.size<3||done.has(k)||muted[k]||shown.includes(k)) continue; if(!best||g.days.size>best.n) best={k,st:g.st,n:g.days.size}; }
  return best;
}
async function proposeRoutine(){
  if(busy||overlayOpen()||pending) return;
  const b=routineToSuggest(); if(!b) return;
  const sug=store.get('sugg',{d:'',k:[]}); if(sug.d!==today()){ sug.d=today(); sug.k=[]; } sug.k.push(b.k); store.set('sugg',sug);
  const verb=a=>label(a).replace(/^./,c=>c.toLowerCase());
  const list=b.st.map(verb), txt=list.length>1?list.slice(0,-1).join(', ')+' y '+list[list.length-1]:list[0];
  const v=await chips('A esta hora suele '+txt+'. ¿Lo hago?',[['Sí','yes','yes'],['Hoy no','no'],['No me lo proponga','mute']],{x:S.x,y:S.y}).catch(()=>null);
  if(v==='yes'){ logEv('idea',{t:'plan',steps:b.st},''); b.st.length===1?run(()=>doAction(b.st[0],null,{noAsk:true})):run(()=>planFlow({acts:b.st,say:'Enseguida.'},null)); }
  else if(v==='mute'){ muted[b.k]=1; store.set('muted',muted); say('Entendido. No se lo vuelvo a proponer.',3000); }
}

function micUI(){ const m=$('#mic'); m.classList.toggle('on',S.listen); m.setAttribute('aria-label',S.listen?'Dejar de escuchar':'Hablar');
  m.querySelector('g').style.display=S.listen?'none':''; m.querySelector('.stop').hidden=!S.listen; }
function toggleEar(){
  if(S.think) return;
  if(S.listen){ S.listen=false; micUI(); status(null); try{ rec&&rec.stop(); }catch(e){} try{ const b=AND(); b&&b.pararOido&&b.pararOido(); }catch(e){} return; }
  const b=AND();
  if(b&&b.escuchar){ try{ b.escuchar(); status('Escuchando'); return; }catch(e){} }
  if(!SR){ say(ON_IOS?'Aquí no tengo micrófono propio. Use el dictado del teclado (el micro junto a la barra espaciadora), o mi app de iPhone.':'Aquí no tengo micrófono propio. Use el dictado del teclado.'); $('#cmd').focus(); return; }
  try{ rec=new SR(); rec.lang='es-ES'; rec.interimResults=true; rec.maxAlternatives=1; let heard='';
    rec.onresult=e=>{ heard=[...e.results].map(r=>r[0].transcript).join(''); earEl.textContent=heard||'Escuchando…'; };
    rec.onerror=e=>{ const er=e&&e.error;
      if(er==='not-allowed'||er==='service-not-allowed'){ say('No me dan el micrófono aquí. Toque el campo y use el micro del teclado.'); $('#cmd').focus(); }
      else if(er==='no-speech') say('No he oído nada. Pruebe otra vez, más cerca.');
      else say('No le he oído bien.'); };
    rec.onend=()=>{ S.listen=false; micUI(); status(null); const t=heard.trim(), was=rec; rec=null; if(t&&!(was&&was.cancelled)) interpret(t); };
    rec.start(); S.listen=true; micUI(); status('Escuchando'); }
  catch(e){ S.listen=false; micUI(); status(null); say('El micrófono no está disponible. Use el dictado del teclado.'); $('#cmd').focus(); }
}

hit.addEventListener('pointerdown',e=>{ try{ hit.setPointerCapture(e.pointerId); }catch(_){} pd={x:e.clientX,y:e.clientY,moved:false,t:performance.now(),long:false};

hit.addEventListener('pointermove',e=>{
  if(!pd) return;
  if(!pd.moved&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>7&&!busy){ pd.moved=true; clearTimeout(lpT); S.user=true; S.hidden=false; S.fl=0; closeMenus(); }
  if(pd.moved){ const nx=clampX(e.clientX), ny=clampY(e.clientY), now=performance.now(), dt=Math.max(.008,(now-pd.t)/1000); pd.t=now;
    S.vx=S.vx*.6+((nx-S.x)/dt)*.4; S.vy=S.vy*.6+((ny-S.y)/dt)*.4; S.x=S.tx=nx; S.y=S.ty=ny; }
});
hit.addEventListener('pointercancel',()=>{ clearTimeout(lpT); if(pd&&pd.moved){ S.user=false; } pd=null; });
hit.addEventListener('pointerup',()=>{
  clearTimeout(lpT); if(!pd) return; const drag=pd.moved, long=pd.long; pd=null; lastActive=performance.now();
  if(drag){ S.user=false; S.vx=S.vy=0; S.tx=S.x; S.ty=S.y; if(roll(.4)) say(pick(['Aquí me quedo.','Buen sitio.','Gracias por el viaje.'])); return; }

function onTap(){
  const n=performance.now(); taps=taps.filter(t=>n-t<650); taps.push(n);
  if(taps.length>=3){ taps=[]; clearTimeout(tapT); quietStopEar(); if(pendingChip) closeChip(); runMove('dance'); return; }
  if(taps.length===2){ clearTimeout(tapT); quietStopEar(); tapT=setTimeout(()=>{ if(taps.length===2){ taps=[]; if(!busy) runMove('jump'); } },420); return; }
  if(busy){ taps=[]; abortFlag=true; if(pendingChip) pendingChip.done(ABORT); return; }
  if(follow){ taps=[]; setFollow(false); return; }
  if(S.hidden){ goHome(); say('¿Sí?'); }
  // Con micro propio empiezo a escuchar ya (iOS lo pide dentro del toque); si llega un segundo toque, lo corto sin decir nada.
  if(SR&&!AND()) toggleEar(); else tapT=setTimeout(()=>{ if(taps.length===1){ taps=[]; toggleEar(); } },400);
}
