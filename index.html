<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Araña">

<title>Araña</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: una sola pantalla fija. Arriba la marca, en medio las "estaciones" (apps, ajustes, bolsillo) por las que camina la araña, abajo la barra de órdenes. */
:root{
  --bg:#eef0f3; --fg:#14171b; --muted:#5d6572; --line:#d4d9e0; --panel:#ffffff; --accent:#2e5a78; --accent-fg:#fff;
  --say-bg:rgba(16,18,22,.86); --say-ink:#f3f1ec; --ring:#e3b866;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Geist", -apple-system, system-ui, "Segoe UI", sans-serif;
  --app-1:#35698c; --app-2:#c4893a; --app-3:#557a52; --app-4:#8c4c5b; --app-5:#4a4f7d; --app-6:#776654; --set:#3a414b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1216; --fg:#e8eaed; --muted:#98a0ab; --line:#262b33; --panel:#171b20; --accent:#8fb7d4; --accent-fg:#0c1014; --set:#2a3039; color-scheme:dark }
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none}
#app{position:fixed; inset:0; display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px, env(safe-area-inset-left,0px))}
.top{display:flex; align-items:baseline; justify-content:space-between; padding:4px 2px 10px}
.brand{font-family:var(--f-display); font-size:34px; line-height:1}
.brand small{font-style:italic; font-size:15px; color:var(--muted); margin-left:6px}
.iconbtn{border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; font-size:13px; padding:7px 12px; border-radius:999px}
.field{flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; overflow:hidden}
/* Pantalla de inicio al estilo de su iPhone: páginas de 4×6, puntos, barra y dock */
:root{--home:#675a4b; --home-ink:#fff; --ic:58px}
body{background:var(--home); -webkit-touch-callout:none}
#app{background:var(--home); color:var(--home-ink)}
#app .brand small{color:rgba(255,255,255,.7)}
#app .top .iconbtn{border-color:rgba(255,255,255,.35); color:#fff}
#app .top .iconbtn.on{background:#fff; color:#2a241d; border-color:#fff}
.top [hidden]{display:none}
.pager{position:relative; flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; margin:0 -16px; touch-action:pan-x}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%; scroll-snap-align:start; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(6,minmax(0,1fr)); align-items:center; justify-items:center; padding:0 12px}
.dots{display:flex; justify-content:center; gap:7px; padding:6px 0 2px}
.dots i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
#app .tile{color:#fff; width:100%; position:relative}
#app .tile .sq{width:var(--ic); height:var(--ic); border-radius:calc(var(--ic)*.23); color:var(--fg2,#fff); box-shadow:0 1px 3px rgba(0,0,0,.18)}
#app .tile .sq b{font-family:var(--f-body); font-weight:600; font-size:calc(var(--ic)*.36); letter-spacing:-.02em}
#app .tile .nm{font-size:11.5px; font-weight:500; text-shadow:0 1px 2px rgba(0,0,0,.35); max-width:calc(var(--ic) + 22px)}
.tile .x{display:none; position:absolute; top:-6px; left:calc(50% - var(--ic)/2 - 6px); width:22px; height:22px; border-radius:50%; background:#d9d6d0; color:#222; font-size:15px; line-height:22px; text-align:center; z-index:2}
body.editing .tile .x{display:block}
body.editing .page .tile .sq, body.editing .dock .tile .sq{animation:jig .26s ease-in-out infinite alternate}
body.editing .page .tile:nth-child(2n) .sq{animation-delay:-.13s}
@keyframes jig{from{transform:rotate(-2deg)} to{transform:rotate(2deg)}}
.folder .sq{background:rgba(255,255,255,.22)!important; display:grid!important; grid-template-columns:repeat(3,1fr); gap:3px; padding:calc(var(--ic)*.14)}
.folder .sq{place-items:stretch!important; align-content:start}
.folder .sq i{display:block; width:100%; border-radius:3px; aspect-ratio:1}
.widget{grid-column:span 2; grid-row:span 2; align-self:stretch; justify-self:stretch; margin:6px 6px 14px; border-radius:22px; padding:12px; background:rgba(30,33,52,.82); color:#fff; display:flex; flex-direction:column; gap:8px; min-height:0; border:0; font:inherit; text-align:left}
.widget .wl{font-size:12px; font-weight:600; letter-spacing:.02em; opacity:.85}
.wgrid{flex:1; display:grid; grid-template-columns:repeat(4,1fr); align-items:center; justify-items:center; gap:4px}
#app .wgrid .tile .sq{width:calc(var(--ic)*.6); height:calc(var(--ic)*.6); border-radius:50%; box-shadow:none; background:rgba(255,255,255,.16)}
#app .wgrid .tile .sq svg{width:18px; height:18px}
#app .wgrid .tile .nm{display:none}
.wpocket #pocketTxt{flex:1; min-height:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; font-size:13.5px; line-height:1.3; opacity:.75}
.wpocket.full #pocketTxt{opacity:1}
.wpocket .dot{width:26px; height:26px; flex:none; border-radius:50%; border:1.5px solid currentColor; display:grid; place-items:center; align-self:flex-end}
.wpocket .dot i{width:7px; height:7px; background:currentColor; transform:rotate(45deg)}
#app #bar{padding:6px 18px 8px}
#app #cmd{background:rgba(25,20,15,.55); border-color:transparent; color:#fff; border-radius:999px; text-align:center}
#app #cmd::placeholder{color:rgba(255,255,255,.75)}
#app #bar .btn.ghost{background:rgba(25,20,15,.55); border-color:transparent; color:#fff; border-radius:999px}
#app #bar .btn{border-radius:999px; background:#fff; color:#2a241d}
.dock{display:grid; grid-template-columns:repeat(4,1fr); justify-items:center; align-items:center; padding:12px 10px; margin:0 -4px; border-radius:34px; background:rgba(20,16,12,.72); min-height:calc(var(--ic) + 24px)}
.dock .tile .nm{display:none}
.inp{width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg)}
.sw{width:30px; height:30px; flex:none; border-radius:8px; display:grid; place-items:center; font-weight:600; font-size:12px}
.lbl{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; margin:0 2px 8px}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px 6px}
.tile{display:flex; flex-direction:column; align-items:center; gap:5px; border:0; background:none; padding:0; color:var(--fg); font:inherit; min-width:0}
.tile .sq{width:54px; height:54px; border-radius:15px; display:grid; place-items:center; background:var(--c); color:#fff; transition:box-shadow .2s}
.tile .sq b{font-family:var(--f-display); font-weight:400; font-size:28px}
.tile .sq svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tile .nm{font-size:11px; font-weight:500; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.webbed{box-shadow:0 0 0 2px var(--ring), 0 0 0 7px rgba(227,184,102,.25)}
.pocket{width:100%; display:flex; align-items:center; gap:12px; border:1px dashed var(--line); background:var(--panel); color:var(--fg); border-radius:16px; padding:12px 14px; font:inherit; text-align:left}
.pocket .dot{width:30px; height:30px; flex:none; border-radius:50%; border:1.5px solid currentColor; display:grid; place-items:center}
.pocket .dot i{width:8px; height:8px; background:currentColor; transform:rotate(45deg)}
.pocket span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted)}
.pocket.full span{color:var(--fg)}
#bar{display:flex; gap:8px; padding-top:10px}
#cmd{flex:1; min-width:0; font:inherit; font-size:16px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--fg); -webkit-user-select:text; user-select:text}
#cmd:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{font:inherit; font-weight:500; border:0; border-radius:14px; padding:12px 16px; background:var(--accent); color:var(--accent-fg)}
.btn.ghost{background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:12px}
button:focus-visible{outline:2px solid var(--ring); outline-offset:2px}

#spider{position:fixed; inset:0; pointer-events:none; mix-blend-mode:difference; z-index:20}
#hit{position:fixed; left:0; top:0; width:66px; height:66px; margin:-33px 0 0 -33px; border-radius:50%; z-index:21; touch-action:none}
#ui{position:fixed; inset:0; pointer-events:none; z-index:22}
.say{position:absolute; left:0; top:0; max-width:230px; padding:7px 12px 8px; border-radius:12px; background:var(--say-bg); color:var(--say-ink);
  font-family:var(--f-display); font-style:italic; font-size:18px; line-height:1.15; opacity:0; transition:opacity .25s}
.say.on{opacity:1}
.chipbox{position:absolute; pointer-events:auto; display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px; border-radius:14px; background:var(--say-bg); color:var(--say-ink);
  max-width:calc(100vw - 24px); animation:pop .22s ease-out}
.chipbox p{margin:0 6px; font-family:var(--f-display); font-style:italic; font-size:17px}
.chipbox button{font:inherit; font-size:13px; font-weight:500; border:0; border-radius:10px; padding:8px 12px; background:rgba(255,255,255,.14); color:var(--say-ink)}
.chipbox button.yes{background:var(--ring); color:#1d1a14}
@keyframes pop{from{opacity:0; transform:translateY(6px)}}

#sheet[hidden]{display:none}
#sheet{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.35); display:flex; align-items:flex-end}
#sheet .card{width:100%; max-height:82%; overflow:auto; background:var(--panel); color:var(--fg); border-radius:22px 22px 0 0;
  padding:18px max(18px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:16px; -webkit-user-select:text; user-select:text}
#sheet h2{margin:0; font-family:var(--f-display); font-weight:400; font-size:28px}
.seg{display:flex; border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{flex:1; text-align:center; font-size:13px; padding:8px 4px; border-radius:9px; color:var(--muted)}
.seg input:checked + label{background:var(--accent); color:var(--accent-fg)}
.note{margin:0; font-size:12.5px; color:var(--muted)}
.learned{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.learned li{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:12px}
.learned .ph{flex:1; min-width:0}
.learned .ph b{display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.learned .ph small{color:var(--muted)}
.learned .sc{font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted)}
.learned button{border:0; background:none; color:var(--muted); font:inherit; font-size:18px; padding:2px 6px}
textarea{width:100%; min-height:90px; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); resize:vertical}
.row{display:flex; gap:8px; flex-wrap:wrap}
.top .row{gap:6px; flex-wrap:nowrap}
.lvl{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.lvl b{font-family:var(--f-display); font-weight:400; font-size:24px}
.lvl small{color:var(--muted); font-variant-numeric:tabular-nums}
.xp{height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:6px}
.xp i{display:block; height:100%; background:var(--ring); border-radius:3px}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.kpis div{border:1px solid var(--line); border-radius:12px; padding:10px}
.kpis b{display:block; font-size:22px; font-weight:500; font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted); font-size:11.5px}
.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font-size:9px; font-family:var(--f-body)}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.events{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:13.5px}
.events li{display:flex; gap:8px; align-items:baseline}
.events .tag{flex:none; font-size:11px; font-weight:600; padding:1px 7px; border-radius:6px; background:var(--line); color:var(--fg)}
.events .tag.ok{background:rgba(85,122,82,.22)} .events .tag.ko{background:rgba(140,76,91,.22)} .events .tag.up{background:rgba(227,184,102,.3)}
.events span.tx{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.events time{margin-left:auto; flex:none; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.wish button{font:inherit; font-size:12.5px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:9px; padding:6px 9px; white-space:nowrap}
.wish button.sent{color:var(--muted); border-style:dashed}
@media (max-height:700px){ .tile .sq{width:48px; height:48px} .grid{gap:8px 6px} .field{gap:10px} .brand{font-size:28px} }
@media (prefers-reduced-motion: reduce){ .chipbox{animation:none} body.editing .tile .sq{animation:none!important} }
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div class="brand">Araña <small>a su servicio</small></div>
    <div class="row" id="topBtns"><button class="iconbtn" id="evo" type="button">Evolución</button><button class="iconbtn" id="gear" type="button">Ajustes</button></div>
    <div class="row" id="editBtns" hidden><button class="iconbtn" id="addApp" type="button">+ Añadir</button><button class="iconbtn on" id="editDone" type="button">Listo</button></div>
  </header>
  <section class="pager" id="pager" aria-label="Pantalla de inicio"></section>
  <div class="dots" id="dots"></div>
  <form id="bar" autocomplete="off">
    <input id="cmd" type="text" placeholder="Dígale qué hacer…" enterkeyhint="go">
    <button class="btn ghost" type="button" id="mic" aria-label="Voz"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></button>
    <button class="btn" type="submit">Ir</button>
  </form>
  <nav class="dock" id="dock" aria-label="Dock"></nav>
</main>

<canvas id="spider"></canvas>
<div id="hit" role="button" aria-label="Araña" tabindex="0"></div>
<div id="ui"><div class="say" id="say"></div></div>

<div id="sheet" hidden>
  <div class="card" id="sheetCard"></div>
</div>

const inkFor=hex=>{ const h=hex.replace('#',''); if(h.length<6) return '#fff'; const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255); return (.299*r+.587*g+.114*b)>.62?'#1d1d1f':'#fff'; };
const initials=n=>{ const w=n.replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/).filter(Boolean); return ((w[0]||'?')[0]+(w.length>1&&w[0].length<5?w[1][0]:'')).toUpperCase(); };

  if(Math.abs(pager.scrollLeft-pg.offsetLeft)<4) return;
  pager.scrollTo({left:pg.offsetLeft,behavior:reduce?'auto':'smooth'}); await wait(reduce?80:520);
}

/* ---------- Organizar (mantener pulsado) ---------- */
const cap=p=>p===0?16:24;
function locate(id){
  for(let p=0;p<home.pages.length;p++){ const i=home.pages[p].indexOf(id); if(i>=0) return {list:home.pages[p],p,i}; }
  const d=home.dock.indexOf(id); if(d>=0) return {list:home.dock,p:-1,i:d};
  for(const k in home.folders){ const i=home.folders[k].apps.indexOf(id); if(i>=0) return {list:home.folders[k].apps,p:-2,f:k,i}; }
  return null;
}
function tidy(){
  for(let p=0;p<home.pages.length;p++){ if(home.pages[p].length>cap(p)){ const extra=home.pages[p].splice(cap(p)); if(!home.pages[p+1]) home.pages.push([]); home.pages[p+1].unshift(...extra); } }
  for(const k in home.folders){ if(!home.folders[k].apps.length){ delete home.folders[k]; const L=locate('f:'+k); if(L) L.list.splice(L.i,1); } }
  home.pages=home.pages.filter((pg,i)=>i===0||pg.length);
}
const commit=()=>{ tidy(); saveHome(); renderHome(); };
function placeAtEnd(id){ let p=home.pages.length-1; if(home.pages[p].length>=cap(p)){ home.pages.push([]); p++; } home.pages[p].push(id); return p; }
function moveBy(id,dir){
  const L=locate(id); if(!L) return; const {list,p,i}=L, j=i+dir;
  if(j>=0&&j<list.length){ [list[i],list[j]]=[list[j],list[i]]; }
  else if(p>=0){ const q=p+dir; if(q<0) return; if(q>=home.pages.length) home.pages.push([]); const other=home.pages[q]; list.splice(i,1);
    if(other.length<cap(q)) dir<0?other.push(id):other.unshift(id);
    else if(dir<0){ const out=other.pop(); other.push(id); list.unshift(out); }
    else { const out=other.shift(); other.unshift(id); list.push(out); } }
  commit();
}
function removeApp(id){ const L=locate(id); if(!L) return; L.list.splice(L.i,1); commit(); say('Quitada de aquí. Con «+ Añadir» vuelve.',3000); }
function addApp(id){ const p=placeAtEnd(id); commit(); setTimeout(()=>goPage(p),60); }

/* ================= Araña: cuerpo ================= */
const S={x:W*.7,y:H*.55,vx:0,vy:0,h:-Math.PI/2,tx:W*.7,ty:H*.55,face:null,fl:0,tuck:0,nod:0,hop:0,sag:0,travelFloat:false,hidden:false,user:false};
const LA=[.5,1.12,1.82,2.45], LR=[40,36,35,41], legs=[];
[1,-1].forEach(side=>LA.forEach((a,k)=>legs.push({a:a*side,r:LR[k],g:(k+(side>0?0:1))%2,fx:0,fy:0,st:null})));
let webs=[]; const carry={on:false,x:0,y:0};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerpAng=(a,b,k)=>{ const d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a+d*k; };
function initLegs(){ legs.forEach(L=>{ const a=S.h+L.a; L.fx=S.x+Math.cos(a)*L.r; L.fy=S.y+Math.sin(a)*L.r; }); }
const topSafe=()=>parseFloat(getComputedStyle($('#app')).paddingTop)||20;
const clampX=x=>Math.max(28,Math.min(W-28,x)), clampY=y=>Math.max(topSafe()+30,Math.min(H-40,y));

function resize(){
  W=innerWidth; H=innerHeight; const dpr=Math.min(3,devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); S.tx=clampX(S.tx); S.ty=clampY(S.ty);
}
addEventListener('resize',resize);

function update(dt,t){
  if(!S.user){
    const dx=S.tx-S.x, dy=S.ty-S.y, d=Math.hypot(dx,dy);
    const mode=prefs.mv==='auto'?(S.travelFloat?'float':'walk'):prefs.mv;
    const max=mode==='float'?330:140;
    let dvx=0,dvy=0; if(d>.5){ const sp=Math.min(max,d*3.2); dvx=dx/d*sp; dvy=dy/d*sp; }
    const k=Math.min(1,dt*5); S.vx+=(dvx-S.vx)*k; S.vy+=(dvy-S.vy)*k; S.x+=S.vx*dt; S.y+=S.vy*dt;
    S.fl+=((((mode==='float'&&d>4)||S.hop>0)?1:0)-S.fl)*Math.min(1,dt*4);
  }
  const sp=Math.hypot(S.vx,S.vy), target=sp>12?Math.atan2(S.vy,S.vx):S.face;
  if(target!=null) S.h=lerpAng(S.h,target,Math.min(1,dt*(sp>12?5:3)));
  S.tuck+=((S.hidden?1:S.sag)-S.tuck)*Math.min(1,dt*3);
  S.nod=Math.max(0,S.nod-dt*1.4); S.hop=Math.max(0,S.hop-dt*1.1); S.sag=Math.max(0,S.sag-dt*.35);
  if(S.hop>0) S.h+=dt*7*Math.sin(S.hop*Math.PI);
  const shrink=1-.42*Math.max(S.fl,S.tuck);
  for(const L of legs){
    const a=S.h+L.a, r=L.r*shrink, ix=S.x+Math.cos(a)*r, iy=S.y+Math.sin(a)*r;
    if(S.fl>.35){ L.st=null; const kk=Math.min(1,dt*14); L.fx+=(ix-L.fx)*kk; L.fy+=(iy-L.fy)*kk; continue; }
    if(L.st){ L.st.t+=dt/.12; const e=ease(Math.min(1,L.st.t)); L.fx=L.st.x0+(L.st.x1-L.st.x0)*e; L.fy=L.st.y0+(L.st.y1-L.st.y0)*e; if(L.st.t>=1) L.st=null; continue; }
    const off=Math.hypot(L.fx-ix,L.fy-iy), thr=sp>15?13:4, other=legs.some(o=>o.st&&o.g!==L.g);
    if(off>thr&&(!other||off>34)) L.st={t:0,x0:L.fx,y0:L.fy,x1:ix+S.vx*.11,y1:iy+S.vy*.11};
  }
  for(const w of webs){
    if(w.out){ w.p-=dt*3.2; if(w.p<=0) w.dead=true; continue; }
    if(w.p<1) w.p=Math.min(1,w.p+dt/.3); else { w.ten=Math.min(1,w.ten+dt/.22); w.b=Math.min(1,w.b+dt/.3); }
  }
  webs=webs.filter(w=>!w.dead);
  if(carry.on){ const tx=S.x-Math.cos(S.h)*36, ty=S.y-Math.sin(S.h)*36; carry.x+=(tx-carry.x)*Math.min(1,dt*6); carry.y+=(ty-carry.y)*Math.min(1,dt*6); }
  hit.style.transform=`translate(${S.x}px,${S.y}px)`;
  placeSay();
  if(!busy&&!S.user&&!S.hidden&&!follow&&!overlayOpen()&&performance.now()-lastActive>8000) hideAtEdge();
}
function ik(hx,hy,fx,fy,L1,L2){
  const dx=fx-hx, dy=fy-hy, len=Math.hypot(dx,dy)||1, d=Math.max(4,Math.min(L1+L2-.5,len)), ux=dx/len, uy=dy/len;
  const a=(L1*L1-L2*L2+d*d)/(2*d), h=Math.sqrt(Math.max(0,L1*L1-a*a)), bx=hx+ux*a, by=hy+uy*a;
  const k1={x:bx-uy*h,y:by+ux*h}, k2={x:bx+uy*h,y:by-ux*h};
  return Math.hypot(k1.x-S.x,k1.y-S.y)>Math.hypot(k2.x-S.x,k2.y-S.y)?k1:k2;
}
function draw(t){
  ctx.clearRect(0,0,W,H); ctx.strokeStyle=ctx.fillStyle='#fff'; ctx.lineCap='round'; ctx.lineJoin='round';
  const bob=Math.sin(t*3.2)*1.8*S.fl-Math.sin(S.hop*Math.PI)*6, hx=Math.cos(S.h), hy=Math.sin(S.h), nod=Math.sin(S.nod*Math.PI*2)*2.4;
  const mouth={x:S.x+hx*(12+nod),y:S.y+hy*(12+nod)+bob};
  for(const w of webs){
    const e=ease(Math.max(0,w.p)), to=w.to, cx=mouth.x+(to.x-mouth.x)*e, cy=mouth.y+(to.y-mouth.y)*e;
    const mx=(mouth.x+cx)/2, my=(mouth.y+cy)/2, len=Math.hypot(cx-mouth.x,cy-mouth.y)||1;
    const sag=(1-w.ten)*Math.min(26,len*.18), px=-(cy-mouth.y)/len, py=(cx-mouth.x)/len, pulse=w.pulse?(.6+.4*Math.sin(t*7)):1;
    ctx.globalAlpha=pulse; ctx.lineWidth=1.25; ctx.beginPath(); ctx.moveTo(mouth.x,mouth.y); ctx.quadraticCurveTo(mx+px*sag,my+py*sag+sag*.4,cx,cy); ctx.stroke();
    ctx.globalAlpha=.35*pulse; ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(mouth.x,mouth.y); ctx.quadraticCurveTo(mx+px*(sag+5),my+py*(sag+5),cx,cy); ctx.stroke();
    if(w.b>0&&!w.out){
      ctx.globalAlpha=pulse; ctx.lineWidth=1;
      for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+.3; ctx.beginPath(); ctx.moveTo(to.x,to.y); ctx.lineTo(to.x+Math.cos(a)*10*w.b,to.y+Math.sin(a)*10*w.b); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(to.x,to.y,6.5*w.b,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(to.x,to.y,1.8,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(carry.on){
    const tail={x:S.x-hx*18,y:S.y-hy*18+bob};
    ctx.lineWidth=1; ctx.globalAlpha=.8; ctx.beginPath(); ctx.moveTo(tail.x,tail.y); ctx.lineTo(carry.x,carry.y); ctx.stroke(); ctx.globalAlpha=1;
    ctx.save(); ctx.translate(carry.x,carry.y); ctx.rotate(Math.PI/4); ctx.fillRect(-4,-4,8,8); ctx.restore();
  }
  ctx.lineWidth=1.5;
  for(const L of legs){
    const a=S.h+L.a, hipx=S.x+hx+Math.cos(a)*4, hipy=S.y+hy+Math.sin(a)*4+bob, fx=L.fx, fy=L.fy+bob*.5, k=ik(hipx,hipy,fx,fy,23,23);
    ctx.beginPath(); ctx.moveTo(hipx,hipy); ctx.lineTo(k.x,k.y); ctx.lineTo(fx,fy); ctx.stroke();
    ctx.beginPath(); ctx.arc(k.x,k.y,1.8,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(fx,fy,1.3,0,Math.PI*2); ctx.fill();
  }
  const ab={x:S.x-hx*10,y:S.y-hy*10+bob}, hd={x:S.x+hx*(6+nod),y:S.y+hy*(6+nod)+bob};
  ctx.beginPath(); ctx.arc(ab.x,ab.y,8.5,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(ab.x,ab.y,2.2,0,Math.PI*2); ctx.fill();
  // Evolución visible: cada nivel añade un rasgo
  if(LV>=1){ ctx.lineWidth=.8; ctx.beginPath(); ctx.arc(ab.x,ab.y,5.2,0,Math.PI*2); ctx.stroke(); ctx.lineWidth=1.5; }
  if(LV>=2){ for(const s of [-1,1]){ const a=S.h+s*.42; ctx.beginPath(); ctx.moveTo(hd.x,hd.y); ctx.lineTo(hd.x+Math.cos(a)*11,hd.y+Math.sin(a)*11); ctx.stroke(); ctx.beginPath(); ctx.arc(hd.x+Math.cos(a)*11,hd.y+Math.sin(a)*11,1.4,0,Math.PI*2); ctx.fill(); } }
  if(LV>=3){ ctx.lineWidth=.8; ctx.setLineDash([1.5,3]); ctx.beginPath(); ctx.arc(ab.x,ab.y,12.5,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1.5; }
  if(LV>=4){ for(let i=0;i<3;i++){ const a=S.h+Math.PI+(i-1)*.5; ctx.beginPath(); ctx.arc(ab.x+Math.cos(a)*16,ab.y+Math.sin(a)*16,1.1,0,Math.PI*2); ctx.fill(); } }
  ctx.beginPath(); ctx.moveTo(ab.x+hx*8.5,ab.y+hy*8.5); ctx.lineTo(hd.x,hd.y); ctx.stroke(); ctx.beginPath(); ctx.arc(hd.x,hd.y,4.6,0,Math.PI*2); ctx.fill();
}
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; update(dt,now/1000); draw(now/1000); requestAnimationFrame(frame); }

/* ================= Araña: acciones básicas ================= */
const ABORT={abort:1}, CANCEL={cancel:1};
let follow=false; // modo «sígame»: camina hacia donde Juan pone el dedo (solo dentro de la app, no se guarda)
let abortFlag=false, busy=false, lastActive=performance.now(), pendingChip=null;
const until=c=>new Promise((res,rej)=>{ const f=()=>{ if(abortFlag) return rej(ABORT); if(c()) return res(); requestAnimationFrame(f); }; f(); });
const wait=ms=>{ const e=performance.now()+ms; return until(()=>performance.now()>=e); };
async function moveTo(x,y){ x=clampX(x); y=clampY(y); S.face=null; S.travelFloat=Math.hypot(x-S.x,y-S.y)>170; S.tx=x; S.ty=y; await until(()=>Math.hypot(S.tx-S.x,S.ty-S.y)<3&&Math.hypot(S.vx,S.vy)<10); }
const faceTo=p=>{ S.face=Math.atan2(p.y-S.y,p.x-S.x); };
async function approach(p){ const dy=p.y>H*.62?-70:66; await moveTo(p.x,p.y+dy); faceTo(p); await wait(200); }
async function web(p){ const w={to:p,p:0,ten:0,b:0}; webs.push(w); await until(()=>w.ten>=1); return w; }
const release=w=>{ if(w){ w.out=true; w.pulse=false; } };
const happy=()=>{ S.hop=1; S.nod=1; }, sad=()=>{ S.sag=.7; };

let sayTimer=null;
function say(text,ms=2600){
  clearTimeout(sayTimer); sayEl.classList.add('on');
  if(reduce) sayEl.textContent=text; else { let i=0; const f=()=>{ sayEl.textContent=text.slice(0,++i); if(i<text.length) setTimeout(f,20); }; f(); }
  sayTimer=setTimeout(()=>sayEl.classList.remove('on'),ms);
}
function placeSay(){
  const bw=sayEl.offsetWidth||120, bh=sayEl.offsetHeight||30;
  const x=Math.max(10,Math.min(W-bw-10,S.x-bw/2)); let y=S.y-62-bh; if(y<topSafe()) y=S.y+50;
  sayEl.style.transform=`translate(${x}px,${y}px)`;
}
/* Caja de opciones junto a un punto. Cada opción: [texto, valor, clase, alPulsar]. alPulsar corre dentro del toque (necesario para abrir apps y portapapeles). */
function chips(text,opts,anchor,w){
  return new Promise((res,rej)=>{
    closeChip();
    if(w) w.pulse=true;
    const box=document.createElement('div'); box.className='chipbox';
    if(text){ const p=document.createElement('p'); p.textContent=text; box.appendChild(p); }
    opts.forEach(([t,v,cls,fn])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=t; if(cls) b.className=cls;
      b.onclick=()=>{ try{ fn&&fn(); }catch(e){} done(v); }; box.appendChild(b); });
    ui.appendChild(box);
    const a=anchor||{x:S.x,y:S.y}, bw=box.offsetWidth, bh=box.offsetHeight;
    const x=Math.max(12,Math.min(W-bw-12,a.x-bw/2)); let y=a.y-bh-28; if(y<topSafe()+4) y=a.y+34;
    box.style.left=x+'px'; box.style.top=y+'px';
    const done=v=>{ box.remove(); if(w) w.pulse=false; if(pendingChip&&pendingChip.box===box) pendingChip=null; v===ABORT?rej(ABORT):res(v); };
    pendingChip={box,done};
  });
}
function closeChip(){ if(pendingChip){ const d=pendingChip.done; pendingChip=null; d(null); } }
const overlayOpen=()=>!!pendingChip||!$('#sheet').hidden;

/* ================= Puente con iOS ================= */
const scURL=(cmd,val)=>`shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT)}&input=text&text=${encodeURIComponent(cmd+'|'+val)}`;
function urlFor(a){
  if(a.t==='open'||a.t==='carry'){ const x=appById(a.id); return x?x.url:''; }
  if(a.t==='set') return scURL(setById(a.id).sc,a.v);
  if(a.t==='wa') return 'whatsapp://send?text='+encodeURIComponent(a.text||'');
  return null;
}
let pending=null, wentAway=false;
function launch(url){ wentAway=false; try{ location.href=url; }catch(e){} }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ wentAway=true; return; }
  if(pending&&wentAway){ const p=pending; pending=null; setTimeout(()=>askFeedback(p),500); }
});

/* ================= Aprendizaje ================= */
function trust(a,phrase){
  const st=stats[keyOf(a)]||{ok:0,ko:0}, m=phrase&&mem[phrase];
  return {st, sure:(m&&m.act&&keyOf(m.act)===keyOf(a)&&m.score>=4)||(st.ok>=3&&st.ko===0), doubtful:st.ko>=2&&st.ko>st.ok};
}
function learn(phrase,a,delta){
  if(!phrase) return;
  const m=mem[phrase]&&keyOf(mem[phrase].act)===keyOf(a)?mem[phrase]:{act:a,score:0};
  m.score+=delta; if(m.score<=-2) delete mem[phrase]; else mem[phrase]=m; saveAll();
}
async function askFeedback(p){
  const v=await chips('¿Lo hice bien?',[['Bien','ok','yes'],['Mal','ko'],['Luego',null]],{x:S.x,y:S.y}).catch(()=>null);
  if(!v) return;
  const k=keyOf(p.act); stats[k]=stats[k]||{ok:0,ko:0};
  if(v==='ok'){ stats[k].ok++; learn(p.phrase,p.act,2); happy(); say(p.phrase?'Gracias. Lo recordaré así.':'Gracias.'); }

function elFor(a){ if(a.t==='open'||a.t==='carry'){ const x=appById(a.id); return x&&x.el; } if(a.t==='set') return setById(a.id).el; if(a.t==='wa'){ const x=appById('whatsapp'); return x&&x.el; } return $('#pocket'); }
async function doAction(a,phrase){
  const el=elFor(a), url=urlFor(a), t=trust(a,phrase);
  if(!el){ say('Esa app ya no está en su pantalla.',3000); return; }

  const nm=(a.t==='open'||a.t==='carry')?appById(a.id).name:'';
  if(!url){
    await reveal(el); const c0=center(el); await approach(c0); sad();

  const mustAsk=a.t==='carry'||prefs.perm==='siempre'||(prefs.perm==='aprendido'&&!t.sure)||t.doubtful;
  let launched=false;
  if(mustAsk){

    const v=await chips(q,[['Sí',true,'yes',go],['No',false]],c,w);

    launched=true;
  } else { press(el); go(); launched=true; }
  press(el); mark(el,false); release(w);

  happy();
  say(a.t==='carry'?'Copiado. Péguelo usted: iOS no me deja pegar dentro de otras apps.':a.t==='wa'?'Elija el contacto. Enviar lo pulsa usted.':a.t==='set'?'Hecho por Atajos.':'Enseguida.',3600);
  // Si el sistema bloqueó el salto, ofrecemos un toque para continuar
  await wait(1300);
  if(launched&&!wentAway&&!document.hidden&&pending){
    const v=await chips('iOS necesita un toque suyo.',[['Continuar',true,'yes',()=>launch(url)],['Cancelar',false]],{x:S.x,y:S.y});

/* ================= Entender órdenes ================= */
const CANT=[
  [/(pulsa|toca|dale|clic|click).*(en|dentro|boton)/,'No puedo tocar dentro de otras apps: iOS no lo permite a ninguna app.'],
  [/(mueve|coloca|recoloca).*(icono|apps|aplicaciones)/,'Los iconos de su iPhone no los puedo mover: Apple no lo permite. Los de aquí sí: mantenga pulsado uno.'],
  [/(borra|elimina|desinstala|instala)\b/,'Instalar o borrar apps solo puede hacerlo usted.'],
  [/(lee|leeme|que dice|mira|revisa).*(pantalla|notificacion|mensajes|correo)/,'No puedo ver lo que hay en otras apps. Si me pega el texto en el bolsillo, lo uso.'],
  [/(llama|llamar)\b/,'Llamar todavía no lo sé hacer. Se puede añadir con un atajo.'],
  [/(alarma|despierta|temporizador)/,'Las alarmas aún no están en mi atajo. Se pueden añadir.'],
];
const ALL_ACTS=()=>[
  ...APPS.map(a=>({act:{t:'open',id:a.id},words:a.al.flatMap(x=>x.split(' '))})),
  ...SETS.flatMap(s=>s.kind==='level'?[{act:{t:'set',id:s.id,v:'50'},words:s.al.concat(['sube','baja'])}]:[{act:{t:'set',id:s.id,v:'on'},words:s.al.concat(['activa','enciende','pon'])},{act:{t:'set',id:s.id,v:'off'},words:s.al.concat(['apaga','desactiva','quita'])}]),
];
function findApp(l){ let best=null,bl=0; for(const a of APPS) for(const x of a.al){ if(x.length>bl&&new RegExp('(^|\\s)'+esc(x)+'(\\s|$)').test(l)){ best=a; bl=x.length; } } return best; }
const findSet=l=>SETS.find(s=>s.al.some(x=>new RegExp('\\b'+x+'\\b').test(l)));
function rules(l,raw){
  const OFF=/\b(apaga|apagar|desactiva|desactivar|quita|quitar|off|cierra|sin)\b/, ON=/\b(enciende|encender|activa|activar|pon|poner|on|con|abre)\b/;
  if(/\b(whatsapp|wasap|whats|guasap)\b/.test(l)&&/\b(envia|manda|escribe|mensaje|dile)\b/.test(l)){
    const text=raw.includes(':')?raw.split(':').slice(1).join(':').trim():'';
    return {act:{t:'wa',text}};
  }
  if(/\b(lleva|llevar|pasa|pasalo|pega|pegalo|copia)\b/.test(l)&&/\b(bolsillo|esto|lo)\b|\ba\b/.test(l)){ const a=findApp(l); if(a) return {act:{t:'carry',id:a.id}}; }
  if(/\b(deja de seguir\w*|para de seguir\w*|no me sigas|no me persigas|quieta|quieto|estate quiet[ao])\b/.test(l)) return {follow:false};
  if(/\b(sigueme|sigas|seguirme|sigue (mi|el) dedo|persigueme|persigas|ven conmigo)\b/.test(l)) return {follow:true};
  if(/\b(guarda|bolsillo)\b/.test(l)) return {pocket:true};
  if(/\b(edita|editar|organiza|organizar|ordena|ordenar|personaliza|personalizar)\b/.test(l)&&/\b(pantalla|iconos|apps|inicio|aplicaciones)\b/.test(l)) return {edit:true};
  for(const [re,msg] of CANT) if(re.test(l)) return {cant:msg};
  const s=findSet(l);
  if(s){
    if(s.kind==='level'){
      const n=l.match(/\d{1,3}/); let v=n?Math.max(1,Math.min(100,+n[0])):/\b(sube|mas|maximo|max|tope)\b/.test(l)?(/max|tope/.test(l)?100:75):/\b(baja|menos|minimo|min)\b/.test(l)?(/min/.test(l)?10:25):null;
      if(v!=null) return {act:{t:'set',id:s.id,v:String(v)}};
      return {suggestSet:s};
    }
    if(OFF.test(l)) return {act:{t:'set',id:s.id,v:'off'}};
    if(ON.test(l)) return {act:{t:'set',id:s.id,v:'on'}};
    return {suggestSet:s};
  }
  const a=findApp(l); if(a) return {act:{t:'open',id:a.id}};
  if(/^(abre|abrir|abra|lanza|entra)\b/.test(l)) return {cant:'Esa app no está en su pantalla. Mantenga pulsado un icono y use «+ Añadir».'};
  return null;
}
function similar(a,b){ const A=new Set(a.split(' ')), B=new Set(b.split(' ')); let i=0; A.forEach(x=>{ if(B.has(x)) i++; }); return i/(A.size+B.size-i||1); }
function guesses(l){
  const toks=l.split(' ');
  return ALL_ACTS().map(o=>({act:o.act,s:o.words.reduce((n,w)=>n+(toks.some(t=>t.length>2&&(w.startsWith(t)||t.startsWith(w)))?1:0),0)}))
    .filter(o=>o.s>0).sort((x,y)=>y.s-x.s).slice(0,3).map(o=>o.act);
}
async function interpret(raw){
  const l=norm(raw); if(!l) return; lastActive=performance.now();
  // 1) Lo aprendido manda
  let m=mem[l]; if(!m){ let best=null,bs=0; for(const k in mem){ const s=similar(k,l); if(s>bs){ bs=s; best=k; } } if(bs>=.75&&mem[best].score>=1) m=mem[best]; }
  if(m&&m.score>=1&&actOK(m.act)) return run(()=>doAction(m.act,l));
  // 2) Reglas
  const r=rules(l,raw);
  if(r&&r.act) return run(()=>doAction(r.act,l));
  if(r&&r.pocket) return fillPocket();
  if(r&&r.edit) return enterEdit();
  if(r&&'follow' in r) return setFollow(r.follow);
  if(r&&r.cant){ sad(); say(r.cant,4200); logEv('cant',null,l); addWish(l,r.cant); return offerClaude(l,r.cant); }
  if(r&&r.suggestSet) return pickSetting(r.suggestSet);
  // 3) No lo entiendo: pregunto y aprendo de su elección
  const g=guesses(l);
  if(!g.length){ say('Eso aún no lo sé hacer.',3000); logEv('unknown',null,l); addWish(l,'No lo entendió.'); return offerClaude(l,'No lo entendió.'); }
  const v=await chips('¿Quería decir…?',[...g.map(a=>[label(a),a]),['Ninguna',null]],{x:S.x,y:S.y}).catch(()=>null);
  if(v){ learn(l,v,1); logEv('learned',v,l); checkLevel(); run(()=>doAction(v,l)); }
  else { logEv('unknown',null,l); addWish(l,'No lo entendió; ninguna sugerencia valía.'); offerClaude(l,'No lo entendió; ninguna sugerencia valía.'); }
}

const TAG={ok:['Bien','ok'],ko:['Mal','ko'],cancel:['No',''],cant:['No puedo',''],unknown:['No sé',''],learned:['Aprendí','ok'],req:['Pedido',''],up:['Nivel','up'],update:['Versión','up']};
function fmtT(ts){ const d=new Date(ts), n=new Date(), p=x=>String(x).padStart(2,'0');
  return d.toDateString()===n.toDateString()?p(d.getHours())+':'+p(d.getMinutes()):p(d.getDate())+'/'+p(d.getMonth()+1); }
function chartSVG(){
  const days=14, now=new Date(); now.setHours(0,0,0,0);
  const rows=[...Array(days)].map((_,i)=>{ const d=new Date(now); d.setDate(d.getDate()-(days-1-i)); return {d,ok:0,ko:0}; });
  for(const e of log){ if(e.r!=='ok'&&e.r!=='ko') continue; const d=new Date(e.ts); d.setHours(0,0,0,0); const i=Math.round((d-rows[0].d)/864e5); if(i>=0&&i<days) rows[i][e.r]++; }
  const max=Math.max(3,...rows.map(r=>r.ok+r.ko)), Wc=320, Hc=96, top=8, bot=16, bw=Wc/days, h=Hc-top-bot;
  let s=`<svg class="chart" viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="Aciertos y fallos de los últimos 14 días">`;
  for(const g of [0,.5,1]){ const y=top+h*(1-g); s+=`<line x1="0" x2="${Wc}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }
  s+=`<text x="${Wc-2}" y="${top-1}" text-anchor="end">${max}</text>`;
  rows.forEach((r,i)=>{ const x=i*bw+bw*.2, w=bw*.6, ho=h*r.ok/max, hk=h*r.ko/max;
    if(r.ok) s+=`<rect x="${x}" y="${top+h-ho}" width="${w}" height="${ho}" rx="2" fill="var(--app-3)"/>`;
    if(r.ko) s+=`<rect x="${x}" y="${top+h-ho-hk}" width="${w}" height="${hk}" rx="2" fill="var(--app-4)"/>`;
    if(i%2===(days-1)%2) s+=`<text x="${x+w/2}" y="${Hc-3}" text-anchor="middle">${r.d.getDate()}</text>`; });
  return s+'</svg>';
}

      <div class="legend"><span><i style="background:var(--app-3)"></i>Bien</span><span><i style="background:var(--app-4)"></i>Mal</span></div></div>
    <div><span class="lbl">Lo último</span>${ev.length?`<ul class="events">${ev.map(e=>{ const t=TAG[e.r]||[e.r,'']; const tx=e.r==='up'?'Ahora es '+e.name:e.r==='update'?'Versión '+e.v:(e.a||'')+(e.p?(e.a?' · ':'')+'«'+e.p+'»':''); return `<li><span class="tag ${t[1]}">${t[0]}</span><span class="tx">${escapeHTML(tx)}</span><time>${fmtT(e.ts)}</time></li>`; }).join('')}</ul>`:'<p class="note">Aún no hay nada. Pídale una tarea y valórela al volver.</p>'}</div>
    <div><span class="lbl">Lo que aún no sé hacer</span>${ws.length?`<ul class="learned wish">${ws.map(([k,w])=>`<li><div class="ph"><b>«${escapeHTML(k)}»</b><small>${w.n} ${w.n===1?'vez':'veces'}</small></div><button type="button" data-ask="${escapeHTML(k)}" class="${w.sent?'sent':''}">${w.sent?'Pedido':'Pedir a Claude'}</button></li>`).join('')}</ul>`:'<p class="note">Nada pendiente.</p>'}
      <p class="note" style="margin-top:6px">«Pedir a Claude» abre una petición en GitHub. Claude la programa, la publica y la araña se actualiza sola.</p></div>
    <div><span class="lbl">Versión ${escapeHTML(VERSION.version)}</span>${(VERSION.notes||[]).length?`<ul class="events">${VERSION.notes.map(n=>`<li><span class="tx" style="white-space:normal">· ${escapeHTML(n)}</span></li>`).join('')}</ul>`:''}</div>
    <div class="row"><button class="btn ghost" type="button" id="diary">Copiar mi diario</button><button class="btn" type="button" id="evClose">Cerrar</button></div>`);
  document.querySelectorAll('#sheet [data-ask]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ask; askClaude(k,wishes[k]&&wishes[k].why); b.textContent='Pedido'; b.classList.add('sent'); });
  $('#diary').onclick=()=>{ const d=JSON.stringify({version:VERSION.version,xp:xpNow(),nivel:levelOf(xpNow()).name,stats,mem,wishes,log:log.slice(-200)},null,1);
    const p=navigator.clipboard&&navigator.clipboard.writeText(d); if(p&&p.then) p.then(()=>say('Diario copiado. Péguelo en el chat con Claude.',3600)).catch(()=>say('No he podido copiarlo.')); };
  $('#evClose').onclick=closeSheet;
}
$('#evo').onclick=openEvolution;
/* Novedades: si Claude ha publicado una versión nueva, la araña lo cuenta */
fetch('version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{
  if(!v||!v.version) return;
  const prev=VERSION.version, isNew=v.version!==prev && !first;
  VERSION=v; store.set('ver',v);
  if(isNew){ logEv('update',null,'',{v:v.version}); setTimeout(()=>{ happy(); say('Me han actualizado a la '+v.version+'. '+((v.notes&&v.notes[0])||''),5200); },3200); }
}).catch(()=>{});

/* ================= Tocar y arrastrar la araña ================= */
let pd=null;
hit.addEventListener('pointerdown',e=>{ hit.setPointerCapture(e.pointerId); pd={x:e.clientX,y:e.clientY,moved:false,t:performance.now()}; });
hit.addEventListener('pointermove',e=>{
  if(!pd) return;
  if(!pd.moved&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>7&&!busy){ pd.moved=true; S.user=true; S.hidden=false; S.fl=0; closeMenus(); }
  if(pd.moved){ const nx=clampX(e.clientX), ny=clampY(e.clientY), now=performance.now(), dt=Math.max(.008,(now-pd.t)/1000); pd.t=now;
    S.vx=S.vx*.6+((nx-S.x)/dt)*.4; S.vy=S.vy*.6+((ny-S.y)/dt)*.4; S.x=S.tx=nx; S.y=S.ty=ny; }
});
hit.addEventListener('pointerup',()=>{
  if(!pd) return; const drag=pd.moved; pd=null; lastActive=performance.now();
  if(drag){ S.user=false; S.vx=S.vy=0; S.tx=S.x; S.ty=S.y; return; }
  if(busy){ abortFlag=true; if(pendingChip) pendingChip.done(ABORT); return; }
  if(follow){ setFollow(false); return; }
  if(S.hidden){ S.hidden=false; S.tx=S.x<W/2?64:W-64; say('¿Sí?'); setTimeout(spiderMenu,600); return; }
  pendingChip?closeChip():spiderMenu();
});
hit.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); spiderMenu(); } });
function spiderMenu(){
  if(busy) return;
  const opts=[['Evolución','evo'],['Bolsillo','pocket'],['Ajustes','settings']];
  if(pocket) opts.unshift(['Llevar bolsillo a…','carry']);
  chips(null,[...opts,['×',null]],{x:S.x,y:S.y}).then(v=>{
    if(v==='evo') openEvolution();
    else if(v==='pocket') fillPocket();
    else if(v==='settings') openSettings();
    else if(v==='carry') chips('¿A dónde?',[...APPS.filter(a=>TXT_APPS.includes(a.id)&&a.url).map(a=>[a.name,a.id]),['×',null]],{x:S.x,y:S.y}).then(id=>{ if(id) run(()=>doAction({t:'carry',id},null)); }).catch(()=>{});
  }).catch(()=>{});
}

/* ================= Arranque ================= */
resize(); S.x=S.tx=W*.68; S.y=S.ty=H*.62; initLegs(); requestAnimationFrame(frame);
const first=!store.get('seen',false); store.set('seen',true);
setTimeout(()=>say(first?'Buenas. Soy su araña. Dígame qué hacer o toque una estación.':'A su servicio.',first?4200:2200),700);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
// Al volver a la app, mira si Claude ha publicado algo nuevo y se recarga
let lastCheck=Date.now();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||Date.now()-lastCheck<5*60e3) return; lastCheck=Date.now();
  fetch('version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{
    if(v&&v.version&&v.version!==VERSION.version&&!busy&&!pending){ say('Hay una versión nueva. Me actualizo.',2000); setTimeout(()=>location.reload(),2200); }
  }).catch(()=>{});
});
// Para pruebas: window.__arana
window.__arana={rules:(t)=>rules(norm(t),t),norm,apps:()=>APPS,home:()=>home};
})();
</script>
