name: Arana
options:
  bundleIdPrefix: com.jrjr3333
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.28.0"
    CURRENT_PROJECT_VERSION: "8"
targets:
  Arana:
    type: application
    platform: iOS
    sources: [Arana]
    info:
      path: Arana/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.jrjr3333.arana
            CFBundleURLSchemes: [arana]
        NSAppleMusicUsageDescription: La araña pone, pausa y busca la música que usted le pide.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jrjr3333.arana
        PRODUCT_NAME: Arana
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Araña
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: La araña lee su agenda y apunta las citas que usted le pide.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: La araña apunta los recordatorios que usted le pide.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: La araña le escucha cuando usted pulsa el micrófono.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: La araña convierte su voz en órdenes.
        INFOPLIST_KEY_LSApplicationQueriesSchemes: "whatsapp spotify youtube instagram shortcuts"
    dependencies:
      - target: AranaIsla
  AranaIsla:
    type: app-extension
    platform: iOS
    sources: [AranaIsla, Arana/IslaDatos.swift, Arana/Escuchar.swift]
    info:
      path: AranaIsla/Info.plist
      properties:
        CFBundleDisplayName: Araña
        # El widget debe llevar la misma versión que la app; si no, iOS no deja instalarla.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jrjr3333.arana.isla
        PRODUCT_NAME: AranaIsla
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Arana:
    build:
      targets:
        Arana: all
