<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Araña · prueba de la red en la gráfica</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b0f17; color: #ebebf5; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  pre { white-space: pre-wrap; background: #121a26; padding: 12px; border-radius: 8px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<h1>Prueba de la red en la gráfica</h1>
<pre id="salida">Probando…</pre>
<script src="../motor.js"></script>
<script src="../gpu.js"></script>
<script src="../red.js"></script>
<script>
/* 1) La red en la gráfica da lo mismo que en el procesador (valor y política).
   2) Sus gradientes coinciden con los del procesador por diferencias finitas.
   3) Aprende: con un objetivo sintético (material y una jugada fija) el error baja y la política acierta más.
   4) (bench=1) Velocidad de un paso de entrenamiento con la red de verdad.
   Parámetros: ?F=8&nb=1&B=32&pasos=60&N=600&bench=0&barrido=0 (N: posiciones de la prueba; una red grande necesita muchas o las memoriza) */
(async () => {
  const q = new URLSearchParams(location.search), num = (k, d) => (q.get(k) ? +q.get(k) : d);
  const M = window.AjedrezMotor, out = { ok: false, pruebas: [], error: '' }, log = t => { document.getElementById('salida').textContent += '\n' + t; };
  try {
    out.gpu = await GPU.iniciar();
    // Posiciones de partidas al azar
    const rng = M.mulberry(7), fens = [];
    const NPOS = num('N', 600); while (fens.length < NPOS) { const p = new M.Pos(); for (let k = 0; k < 10 + Math.floor(rng() * 50); k++) { const ms = M.legal(p); if (!ms.length || M.fin(p)) break; p.make(ms[Math.floor(rng() * ms.length)]); } if (M.legal(p).length && !M.fin(p)) fens.push(p.fen()); }
    const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const objetivo = fen => {   // sintético: valor = tanh(material del que mueve / 5); jugada = la primera legal en orden alfabético
      const pl = fen.split(' ')[0], negras = / b /.test(fen); let m = 0;
      for (const ch of pl) { const v = VAL[ch.toLowerCase()]; if (v) m += (ch === ch.toUpperCase() ? 1 : -1) * v; }
      const ms = M.legal(new M.Pos(fen)).map(M.uci).sort();
      return { x: Red.codificar(fen, new Float32Array(Red.PL * 64)), t: Math.tanh((negras ? -m : m) / 5), obj: Red.indiceJugada(ms[0], negras) };
    };
    const datos = fens.map(objetivo);
    // 1) y 2) con una red pequeña
    { const red = Red.crear({ filtros: 6, bloques: 1, semilla: 3 }), Bp = 3, g = await Red.enGPU(red, { lote: Bp, lr: 0, l2: 0, wv: 1, wp: 1 });
      const lote = datos.slice(0, Bp), Xc = new Float32Array(Bp * Red.PL * 64); lote.forEach((m, i) => Xc.set(m.x, i * Red.PL * 64));
      const cpu = Red.adelanteCPU(red, Xc, Bp), gv = await g.valorar(lote);
      let dv = 0, dp = 0; for (let i = 0; i < Bp; i++) { dv = Math.max(dv, Math.abs(gv.valor[i] - Math.tanh(cpu.zv[i]))); for (let j = 0; j < Red.NP; j++) dp = Math.max(dp, Math.abs(gv.politica[i * Red.NP + j] - cpu.lg[i * Red.NP + j])); }
      out.pruebas.push({ nombre: 'la gráfica valora igual que el procesador', diferencia: Math.max(dv, dp), ok: Math.max(dv, dp) < 1e-3 });
      await g.paso(lote); const gr = await g.gradientes();
      const T = Float32Array.from(lote.map(m => m.t)), O = lote.map(m => m.obj), D = Red.disposicion(red.filtros, red.bloques, red.cabeza);
      const L = () => Red.perdidaCPU(red, Xc, T, O, Bp, 1, 1);
      let peor = 0, n = 0, malos = 0; const eps = 1e-4, r2 = M.mulberry(9);
      for (const t of D.tensores) for (let k = 0; k < 4; k++) {
        const i = t.off + Math.floor(r2() * t.n), v0 = red.pesos[i];
        red.pesos[i] = v0 + eps; const a = L(); red.pesos[i] = v0 - eps; const b = L(); red.pesos[i] = v0;
        const num = (a - b) / (2 * eps), ana = gr[i], err = Math.abs(num - ana) / Math.max(1e-3, Math.abs(num) + Math.abs(ana));
        n++; if (err > .05) { malos++; (out.malos = out.malos || []).push(`${t.nombre}[${i - t.off}]: ${num.toExponential(2)} / ${ana.toExponential(2)}`); } peor = Math.max(peor, err);
      }
      out.pruebas.push({ nombre: `gradientes contra el procesador (${n} pesos de ${D.tensores.length} tensores)`, diferencia: peor, malos, ok: malos <= Math.ceil(n * .1) });
      g.cerrar(); }
    // 3) aprende
    { const F = num('F', 8), nb = num('nb', 1), B = num('B', 32), pasos = num('pasos', 60);
      const red = Red.crear({ filtros: F, bloques: nb, semilla: 5 }), g = await Red.enGPU(red, { lote: B });
      const prueba = datos.filter((_, i) => i % 5 === 0), ent = datos.filter((_, i) => i % 5 !== 0), r3 = M.mulberry(11);
      // Se mide cada 10 % de los pasos y se queda el mejor momento: con pocos datos, una red grande acaba memorizando (sobreajuste)
      const antes = await g.medir(prueba), t0 = performance.now(), curva = []; let mejor = null, msEnt = 0;
      for (let s = 0; s < pasos; s++) {
        const ta = performance.now(), lote = []; for (let i = 0; i < B; i++) lote.push(ent[Math.floor(r3() * ent.length)]); await g.paso(lote); if (s % 10 === 9) await g.esperar(); msEnt += performance.now() - ta;
        if ((s + 1) % Math.max(1, Math.round(pasos / 10)) === 0) { await g.esperar(); const m = await g.medir(prueba); curva.push({ paso: s + 1, valor: +m.valor.toFixed(3), politica: +m.politica.toFixed(2), acierto: +m.acierto.toFixed(3) }); if (!mejor || m.politica + m.valor < mejor.politica + mejor.valor) mejor = Object.assign({ paso: s + 1 }, m); }
      }
      await g.esperar(); const despues = await g.medir(prueba), sobre = despues.politica > mejor.politica * 1.1 || despues.valor > mejor.valor * 1.1;
      out.aprende = { F, nb, B, pasos, antes, mejor, despues, curva, sobreajuste: sobre, vueltas: Math.round(pasos * B / ent.length), msPorPaso: Math.round(msEnt / pasos * 10) / 10 };
      out.pruebas.push({ nombre: `aprende: en su mejor momento (paso ${mejor.paso}) error del valor ${antes.valor.toFixed(3)} → ${mejor.valor.toFixed(3)}, pérdida de la política ${antes.politica.toFixed(2)} → ${mejor.politica.toFixed(2)}, acierta ${Math.round(mejor.acierto * 100)} %` + (sobre ? ` (después memoriza: ${out.aprende.vueltas} vueltas a ${ent.length} posiciones)` : ''), ok: mejor.valor < antes.valor && mejor.politica < antes.politica && mejor.acierto > antes.acierto });
      g.cerrar(); }
    // 3b) barrido: varias combinaciones sobre las mismas posiciones (?barrido=1)
    if (num('barrido', 0)) {
      const F = num('F', 64), nb = num('nb', 6), B = num('B', 256), pasos = num('pasos', 600), r4 = M.mulberry(13);
      const prueba = datos.filter((_, i) => i % 5 === 0).slice(0, 2048), ent = datos.filter((_, i) => i % 5 !== 0);
      const CFG = [['plano', 2e-3, .1], ['plano', 1e-3, .1], ['plano', 5e-4, .1], ['plano', 2e-4, .1], ['plano', 1e-3, 1], ['media', 2e-3, .1], ['media', 1e-3, .1], ['media', 5e-4, .1], ['plano', 1e-3, 0], ['media', 1e-3, 0]];
      out.barrido = [];
      for (const [cabeza, lr, wp] of CFG) {
        const red = Red.crear({ filtros: F, bloques: nb, semilla: 5, cabeza }), g = await Red.enGPU(red, { lote: B, lr, wp });
        const a = await g.medir(prueba); let mejor = a;
        for (let s = 0; s < pasos; s++) { const lote = []; for (let i = 0; i < B; i++) lote.push(ent[Math.floor(r4() * ent.length)]); await g.paso(lote); if ((s + 1) % Math.round(pasos / 5) === 0) { const m = await g.medir(prueba); if (m.valor < mejor.valor) mejor = m; } }
        const d = await g.medir(prueba); g.cerrar();
        out.barrido.push({ cabeza, lr, wp, valorAntes: +a.valor.toFixed(3), valorFin: +d.valor.toFixed(3), valorMejor: +mejor.valor.toFixed(3), acierto: Math.round(d.acierto * 100) });
        log(JSON.stringify(out.barrido[out.barrido.length - 1]));
      }
    }
    // 4) velocidad con la red de verdad
    if (num('bench', 0)) { const B = num('benchB', 256), red = Red.crear({ filtros: num('benchF', 64), bloques: num('benchNb', 6) }), g = await Red.enGPU(red, { lote: B }), lote = datos.slice(0, B);
      await g.paso(lote); await g.esperar(); const t0 = performance.now(), n = 20; for (let s = 0; s < n; s++) await g.paso(lote); await g.esperar();
      const ms = (performance.now() - t0) / n; out.velocidad = { lote: B, filtros: red.filtros, bloques: red.bloques, msPorPaso: Math.round(ms * 10) / 10, posicionesPorSegundo: Math.round(B / ms * 1000) }; g.cerrar(); }
    out.ok = out.pruebas.every(p => p.ok);
  } catch (e) { out.error = (e && e.stack) || String(e); }
  window.__prueba = out; log(JSON.stringify(out, null, 2));
})();
</script>
</body>
</html>
