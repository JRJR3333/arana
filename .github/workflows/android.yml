# Compila la araña para Android en la nube y deja el APK en la versión «android» del repositorio.
name: App Android
on:
  push:
    branches: [master]
    paths: ["nativo/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  # 0.47.0: la caché de Actions borra lo que no se usa en 7 días; compilar cada 3 días mantiene viva la llave
  schedule:
    - cron: "17 4 */3 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      # 0.42.0: sin llave propia, cada compilación firmaba con una llave nueva y Android no dejaba
      # actualizar encima (había que desinstalar). La llave se guarda en la caché de Actions (no en el repo).
      # 0.47.0 (#53): Gradle no dejaba la llave en ~/.android, así que la caché nunca se guardó y cada APK
      # salía con otra llave («conflicto con un paquete existente»). Ahora la creamos nosotros en un sitio fijo.
      - name: Misma llave de depuración en cada versión
        uses: actions/cache@v4
        with:
          path: ~/.arana-firma/debug.jks
          key: arana-debug-keystore-v1
      - name: Llave de firma (la de Secrets si Juan la pone; si no, la de la caché)
        env: { KS: "${{ secrets.ARANA_KEYSTORE_B64 }}", KP: "${{ secrets.ARANA_KEYSTORE_PASS }}", KA: "${{ secrets.ARANA_KEY_ALIAS }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/arana.jks"
            { echo "ARANA_KEYSTORE=$RUNNER_TEMP/arana.jks"; echo "ARANA_KEYSTORE_PASS=$KP"; echo "ARANA_KEY_ALIAS=$KA"; } >> "$GITHUB_ENV"
          else
            F="$HOME/.arana-firma/debug.jks"
            if [ ! -f "$F" ]; then
              mkdir -p "$(dirname "$F")"
              keytool -genkeypair -v -keystore "$F" -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arana Debug,O=Arana,C=ES"
              echo "Llave nueva creada (solo pasa la primera vez)."
            else
              echo "Llave restaurada de la caché."
            fi
            { echo "ARANA_KEYSTORE=$F"; echo "ARANA_KEYSTORE_PASS=android"; echo "ARANA_KEY_ALIAS=androiddebugkey"; } >> "$GITHUB_ENV"
          fi
          keytool -list -v -keystore "$(grep ^ARANA_KEYSTORE= "$GITHUB_ENV" | tail -1 | cut -d= -f2)" -storepass "${KP:-android}" 2>/dev/null | grep -m1 SHA256 || true
      - name: Compilar
        working-directory: nativo/android
        run: gradle --no-daemon assembleDebug
      - name: Publicar el APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp nativo/android/app/build/outputs/apk/debug/app-debug.apk arana.apk
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease --title "Araña para Android" --notes "Descargue arana.apk en el móvil Android y ábralo. Guía: nativo/android/LEEME.md"
          gh release upload android arana.apk --clobber
